      <div class="muted">登場人物の資料は ${Object.keys(g.deep.dossiers).length} 人分あります（人物タブの各カードで見られます）。</div>
      <div class="row"><button class="btn primary" id="deepsave">保存</button><span class="muted" id="deepst"></span></div></div>`;
  }

  async function runDeep(g) {
    if (S.deepStep != null || S.busy) return;
    S.deepStep = 0; S.toast = '';
    const refresh = () => { if (S.G !== g) return; if (S.sheet) renderSheet(); else renderGame(); };
    refresh();
    try {
      await buildDeep(g, (i) => { S.deepStep = i; refresh(); });
      S.variants = null; if (S.G === g) save();
    } catch (e) { S.toast = aiMsg(e); }
    S.deepStep = null;
    if (S.G === g) renderGame();
  }

  function factionColor(id, home) {
    if (id === home) return 'var(--accent)';
    let h = 0;
    for (const ch of str(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    let hue = h % 360;
    if (hue > 210 && hue < 260) hue = (hue + 60) % 360; // あなたの色（青）と見分けやすく
    return `hsl(${hue} 55% ${50 + (h % 3) * 6}%)`;
  }
  function sheetMap(g) {
    const P = g.pref;
    const fs = prefFactions(g);
    const zoom = S.mapZoom || 'all';
    const vb = jmapView(zoom);
    const fsz = Math.round(vb[2] / (zoom === 'all' ? 58 : 30));
    const hatch = [], own = [], fills = [], labels = [];
    PREF.forEach(([id, full, short]) => {
      const r = P.regions[id];
      const d = JMAP_SHAPES[full];
      fills.push(`<path class="jm-p" data-pt="${id}" d="${d}" fill="${factionColor(r.owner, P.home)}"><title>${esc(full)}</title></path>`);
      if (r.owner !== id) hatch.push(`<path d="${d}"/>`);
      if (r.owner === P.home) own.push(`<path d="${d}"/>`);
      const [lx, ly] = JMAP_LABELS[full];
      labels.push(`<text x="${lx}" y="${ly}">${esc(short)}</text>`);
    });
    const O = JMAP_OKI_BOX;
    const L = (n) => JMAP_LABELS[PF[n].full];
    const links = PREF_LINKS.map(([a, b]) => { const p1 = L(PF_BY_SHORT[a]); const p2 = L(PF_BY_SHORT[b]); return `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}"/>`; }).join('');
    const selD = S.mapSel && PF[S.mapSel] ? JMAP_SHAPES[PF[S.mapSel].full] : '';
    const zoomBar = `<div class="jzoom" role="group" aria-label="地図の範囲">${JMAP_ZOOMS.map(([k, t]) => `<button data-jz="${k}" aria-pressed="${zoom === k}">${t}</button>`).join('')}</div>`;
    const cells = `${zoomBar}<svg class="jmap${zoom === 'all' ? ' far' : ''}" viewBox="${vb.join(' ')}" role="img" aria-label="日本地図">
      <defs><pattern id="jm-hatch" patternUnits="userSpaceOnUse" width="9" height="9" patternTransform="rotate(45)"><rect width="3.5" height="9" fill="rgba(255,255,255,0.4)"/></pattern></defs>
      ${zoom === 'all' ? `<rect class="jm-inset" x="${O[0] + 1}" y="${O[1] + 1}" width="${O[2] - 2}" height="${O[3] - 2}" rx="8" data-pt="okinawa"/>` : ''}
      <g class="jm-links">${links}</g>
      <g class="jm-own">${own.join('')}</g>
      <g>${fills.join('')}</g>
      <g class="jm-hatch">${hatch.join('')}</g>
      ${selD ? `<path class="jm-sel" d="${selD}"/>` : ''}
      <g class="jm-lbl" font-size="${fsz}" stroke-width="${(fsz * 0.22).toFixed(1)}">${labels.join('')}</g>
    </svg>`;
    const sel = S.mapSel && PF[S.mapSel];
    let detail = '<p class="muted" style="margin:0">県を押すと、詳しい情報と行動が出ます。</p>';
    if (sel) {
      const r = P.regions[sel.id];
      const owner = r.owner;
      const e = g.entities.find((x) => x.pref === owner);
      const al = allianceOf(g, owner);
      const mineAdj = Object.keys(P.regions).some((m) => P.regions[m].owner === P.home && PF[m].adj.has(sel.id));
      const isMine = owner === P.home;
      detail = `<div class="row"><b style="font-size:18px">${esc(sel.full)}</b><span class="badge ${isMine ? 'success' : 'partial'}">${isMine ? 'あなたの勢力' : esc(pfName(owner)) + '勢力'}</span></div>
        <div class="muted">力 ${r.power}／人口 ${sel.pop}万人／${sel.sea ? '海に面する' : '内陸'}${al ? '／' + esc(al.name) : ''}${e && !isMine ? `／あなたへの好感 ${e.relation}` : ''}</div>
        <div style="font-size:14px">強み: ${esc(sel.spec)}</div>
        <div style="font-size:14px">気質: ${esc(sel.temper)}／${esc(sel.speech)}</div>
        <div class="muted">隣接: ${[...sel.adj].map((n) => esc(PF[n].short) + (sel.links[n] ? `（${esc(sel.links[n])}）` : '')).join('・') || 'なし（海のみ）'}</div>
        ${isMine ? `<div class="quick"><button data-pact="守りを固め、${esc(sel.full)}の防衛線を整える">${ic('bolt')}守りを固める</button><button data-pact="${esc(sel.full)}の${esc(sel.spec.split('・')[0])}を使って、他県との取引を進める">${ic('wallet')}特産品で取引</button></div>`
        : `<div class="quick">${mineAdj || sel.sea ? `<button data-pact="${esc(sel.full)}に攻め込む${mineAdj ? '' : '（海路で上陸する）'}">${ic('bolt')}攻め込む</button>` : ''}<button data-pact="${esc(pfName(owner))}に同盟を持ちかける">${ic('people')}同盟を持ちかける</button><button data-pact="${esc(pfName(owner))}に降伏・合併を勧告する">${ic('board')}降伏を勧告</button>${e && e.status !== '滅亡' ? `<button data-ptalk="${esc(e.id)}">${ic('chat')}代表と話す</button>` : ''}</div>`}`;
    }
    const ranking = Object.values(fs).sort((a, b) => b.power - a.power).slice(0, 10).map((f) => `<div class="row" style="gap:8px"><span class="swatch" style="background:${factionColor(f.id, P.home)}"></span><b style="flex:1">${esc(pfName(f.id))}${f.id === P.home ? '（あなた）' : ''}</b><span class="muted">${f.regions.length}県・力${f.power}</span></div>`).join('');
    const alliances = P.alliances.length ? P.alliances.map((a) => `<div><b>${esc(a.name)}</b><span class="muted">　${a.members.map((m) => esc(PF[m].short)).join('・')}</span></div>`).join('') : '<p class="muted" style="margin:0">いまは連合はない。</p>';
    const mineN = (fs[P.home] || { regions: [] }).regions.length;
    return `<div class="box"><div class="row" style="justify-content:space-between"><b>あなたの勢力: ${mineN} / 47 都道府県</b><span class="muted">生き残り ${Object.keys(fs).length} 勢力</span></div>
      ${cells}<p class="muted" style="margin:6px 0 0">色 = 支配している勢力。太枠 = あなたの勢力。斜線 = もとの県とは別の勢力が支配。点線 = 橋・トンネル。沖縄は左上の枠に拡大して表示。</p></div>
      <div class="box" style="display:grid;gap:6px">${detail}</div>
      <p class="sec">勢力の大きさ</p><div class="box" style="display:grid;gap:6px">${ranking}</div>
      <p class="sec">連合</p><div class="box" style="display:grid;gap:4px;font-size:14px">${alliances}</div>`;
  }

  function sheetSettings(g) {
    return `${deepBlock(g)}
      ${judgeControls(g)}
      <label class="selrow">${ic('spark')}<b>AI の考え方</b><select id="tiersel">${Object.entries(TIERS).map(([k, v]) => `<option value="${k}" ${tierOf() === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <p class="muted" style="margin:-4px 4px 0">速い: すぐ返るが判定は大まか／標準: ふつう／じっくり: 時間はかかるが筋の通った展開に。</p>
      <div class="box"><b>${esc(g.title)}</b><div class="muted" style="margin-top:4px">${esc(g.premise)}</div></div>
      ${g.mode === 'work' && !g.deep ? `<div class="box" style="display:grid;gap:6px"><b>原作資料（簡易版）</b><span class="muted">AI が知っている原作の知識をまとめたもの。毎手これに従います。間違いや足りない設定は書き直してください（例: 人物の術式・強さ・世界のルール）。</span>
        <textarea id="lore" rows="10" maxlength="3000" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface-2);font-size:13.5px;line-height:1.7">${esc(g.lore)}</textarea>
        <div class="row" style="flex-wrap:wrap"><button class="btn primary" id="loresave">保存</button><button class="btn" id="loregen" ${S.busy || S.fillingLore ? 'disabled' : ''}>${S.fillingLore ? 'まとめています…' : 'AI に作り直させる'}</button><span class="muted" id="lorest"></span></div></div>` : ''}
      <div class="box"><b>記録の保存先</b><div class="muted" style="margin-top:4px">${Store.cloud ? 'claude.ai のあなた専用の保存場所（あなた以外は読めません）。PC とスマホで同じ続きを遊べます。' : 'このブラウザの中だけ。ブラウザのデータを消すと失われます。'}<br>物語 ${g.log.length} 件・年代記 ${g.chronicle.length} 行・あらすじに畳んだ出来事 ${g.synopsisUpTo} 件</div></div>
      <div class="box"><b>この画面の版</b><div class="muted" style="margin-top:4px">${APP_VERSION}。表示が古いと感じたら、このページを閉じて開き直してください。</div></div>
      <button class="act-btn" id="tohome"><span class="ico">${ic('back')}</span><span><b>題へ戻る</b><small>記録は自動で保存されています</small></span></button>
      <button class="btn danger" id="delw" style="justify-self:start">この世界の記録を消す</button>`;
  }

  function renderSheet() {
    const wrap = document.getElementById('sheetwrap');
    if (!wrap) return;
    const g = S.G;
    if (!S.sheet || !g) { wrap.innerHTML = ''; return; }
    const tabbar = app.querySelector('.tabbar');
    app.style.setProperty('--tabh', (tabbar ? tabbar.offsetHeight : 64) + 'px');
    const k = S.sheet;
    const [icn, ttl] = SHEET_TITLE[k];
    const body = { time: sheetTime, stat: sheetStat, people: sheetPeople, chat: sheetChat, wallet: sheetWallet, items: sheetItems, quest: sheetQuest, log: sheetLog, settings: sheetSettings, map: sheetMap }[k](g);
    const extra = k === 'quest' ? `<button id="qref" aria-label="依頼を更新" ${S.questBusy ? 'disabled' : ''}>${ic('refresh')}</button>` : '';
    wrap.innerHTML = `<div class="scrim" id="scrim"></div><div class="sheet${S.full ? ' full' : ''}" data-k="${k}" role="dialog" aria-label="${ttl}"><div class="grab"></div>
      <div class="sh"><span class="ttl">${ic(icn)}${ttl}</span>${extra}<button id="sfull" aria-label="${S.full ? '小さくする' : '大きくする'}">${ic(S.full ? 'shrink' : 'expand')}</button><button id="sclose" aria-label="閉じる">${ic('minus')}</button></div>
      <div class="body" id="sbody">${body}</div></div>`;
    const $ = (id) => document.getElementById(id);
    $('scrim').onclick = () => openSheet(null);
    $('sclose').onclick = () => openSheet(null);
    $('sfull').onclick = () => { S.full = !S.full; renderSheet(); };
    // 種類ごとの操作
    if ($('hist')) $('hist').onclick = () => { S.histOpen = !S.histOpen; renderSheet(); };
    if ($('skip')) $('skip').onclick = () => sendAction('（時間を進める）次の大きな出来事が起きるまで時間を進める。その間の日々は要約して語る。');
    if ($('jumpgo')) $('jumpgo').onclick = () => { const v = $('jump').value.trim(); if (v) sendAction(`（時間を進める）「${v}」まで時間を進める。その間の出来事は要約して語る。`); };
    if ($('pace')) $('pace').onchange = (e) => { g.settings.tempo = e.target.value; save(); };
    app.querySelectorAll('[data-pedit]').forEach((b) => b.onclick = () => { S.editPersona = b.dataset.pedit; renderSheet(); });
    app.querySelectorAll('[data-pcancel]').forEach((b) => b.onclick = () => { S.editPersona = null; renderSheet(); });
    app.querySelectorAll('[data-psave]').forEach((b) => b.onclick = () => {
      const e = g.entities.find((x) => x.id === b.dataset.psave);
      if (!e) return;
      const box = b.closest('.pedit');
      const p = {};
      box.querySelectorAll('[data-pk]').forEach((t) => (p[t.dataset.pk] = t.value));
      e.persona = normPersona(p);
      S.editPersona = null; S.variants = null;
      save(); renderSheet();
    });
    app.querySelectorAll('[data-talk]').forEach((b) => b.onclick = () => { S.sheet = 'chat'; S.chatWith = b.dataset.talk; app.querySelectorAll('.tabbar [data-tab]').forEach((x) => x.setAttribute('aria-selected', String(x.dataset.tab === 'chat'))); renderSheet(); });
    app.querySelectorAll('[data-chat]').forEach((b) => b.onclick = () => { S.chatWith = b.dataset.chat; S.toast = ''; renderSheet(); });
    if ($('chatgo')) $('chatgo').onclick = () => { const e = g.entities.find((x) => x.id === S.chatWith); if (e) sendAction(`（${e.name}との会話を踏まえて）話し合ったことを実行に移し、物語を進める。`); };
    if ($('cback')) $('cback').onclick = () => { S.chatWith = null; S.toast = ''; renderSheet(); };
    if ($('csend')) {
      const inp = $('cmsg');
      if (S.chatDraft) { inp.value = S.chatDraft; S.chatDraft = ''; }
      const go = () => { S.toast = ''; sendChat(S.chatWith, inp.value); };
      $('csend').onclick = go;
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); go(); } });
      const sb = $('sbody'); sb.scrollTop = sb.scrollHeight;
      if (!S.chatBusy) inp.focus({ preventScroll: true });
    }
    app.querySelectorAll('[data-item]').forEach((b) => b.onclick = () => { S.itemSel = +b.dataset.item; S.dropArmed = false; renderSheet(); });
    if ($('dropitem')) $('dropitem').onclick = () => {
      if (!S.dropArmed) { S.dropArmed = true; return renderSheet(); }
      const it = g.items[S.itemSel];
      if (it) { g.items.splice(S.itemSel, 1); g.chronicle.push(`${g.turn}｜${g.date}｜「${it.name}」を手放した`); }
      S.itemSel = null; S.dropArmed = false; S.variants = null; save(); renderSheet();
    };
    if ($('useitem')) $('useitem').onclick = () => { const it = g.items[S.itemSel]; openSheet(null); const ta = $('cmd'); if (ta && it) { ta.value = `「${it.name}」を使って、`; ta.focus(); } };
    app.querySelectorAll('[data-accept]').forEach((b) => b.onclick = () => { const q = g.quests.find((x) => x.id === b.dataset.accept); if (q) sendAction(`依頼「${q.title}」（依頼主: ${q.client}）を引き受ける。`); });
    if ($('qref')) $('qref').onclick = () => { S.toast = ''; refreshQuests(); };
    if ($('judgesel')) $('judgesel').onchange = (e) => { g.settings.judge = e.target.value; S.variants = null; save(); };
    if ($('drainsel')) $('drainsel').onchange = (e) => { g.settings.drain = e.target.value; S.variants = null; save(); };
    if ($('statedit')) $('statedit').onclick = () => { S.editStats = true; renderSheet(); };
    if ($('statedit2')) $('statedit2').onclick = () => { S.editStats = true; S.full = true; renderSheet(); };
    if ($('pledit2')) $('pledit2').onclick = () => { S.editPlayer = true; S.full = true; renderSheet(); const el = app.querySelector('[data-plk]'); if (el) { el.scrollIntoView({ block: 'center' }); } };
    if ($('tojudge')) $('tojudge').onclick = () => { const el = document.getElementById('judgeanchor'); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); };
    if ($('statcancel')) $('statcancel').onclick = () => { S.editStats = false; renderSheet(); };
    if ($('statsave')) $('statsave').onclick = () => {
      app.querySelectorAll('[data-sv]').forEach((inp) => { const st = g.stats.find((x) => x.key === inp.dataset.sv); if (st) st.value = clamp(Math.round(num(inp.value, st.value)), st.min, st.max); });
      app.querySelectorAll('[data-sd]').forEach((cb) => { const st = g.stats.find((x) => x.key === cb.dataset.sd); if (st) st.drain = cb.checked; });
      g.chronicle.push(`${g.turn}｜${g.date}｜（数値を手で直した）`);
      S.editStats = false; S.variants = null; save(); renderSheet();
    };
    if ($('tiersel')) $('tiersel').onchange = (e) => { g.settings.tier = e.target.value; save(); const t = $('tier'); if (t) t.innerHTML = ic('spark') + TIERS[tierOf()]; };
    if ($('tohome')) $('tohome').onclick = () => renderTitle();
    if ($('pledit')) $('pledit').onclick = () => { S.editPlayer = true; renderSheet(); };
    if ($('plcancel')) $('plcancel').onclick = () => { S.editPlayer = false; renderSheet(); };
    if ($('plsave')) $('plsave').onclick = () => {
      const p = {};
      app.querySelectorAll('[data-plk]').forEach((t) => (p[t.dataset.plk] = t.value));
      g.player = normPlayer(p); S.editPlayer = false; S.variants = null; save(); renderSheet();
    };
    if ($('loresave')) $('loresave').onclick = () => { g.lore = $('lore').value.trim().slice(0, 3000); S.variants = null; save(); $('lorest').textContent = '保存しました'; };
    app.querySelectorAll('[data-pt]').forEach((b) => b.onclick = () => { S.mapSel = b.dataset.pt; renderSheet(); });
    app.querySelectorAll('[data-jz]').forEach((b) => b.onclick = () => { S.mapZoom = b.dataset.jz; renderSheet(); });
    app.querySelectorAll('[data-pact]').forEach((b) => b.onclick = () => { const text = b.dataset.pact; openSheet(null); const ta = document.getElementById('cmd'); if (ta) { ta.value = text; ta.focus(); } });
    app.querySelectorAll('[data-ptalk]').forEach((b) => b.onclick = () => { S.sheet = 'chat'; S.chatWith = b.dataset.ptalk; app.querySelectorAll('.tabbar [data-tab]').forEach((x) => x.setAttribute('aria-selected', String(x.dataset.tab === 'chat'))); renderSheet(); });
    if ($('deepgo')) $('deepgo').onclick = () => runDeep(g);
    if ($('deepsave')) $('deepsave').onclick = () => {
      g.deep.rules = $('deeprules').value.trim().slice(0, 3000);
      g.deep.player = $('deepplayer').value.trim().slice(0, 1500);
      g.deep.matchups = $('deepmatch').value.trim().slice(0, 3000);
      g.trackers = $('deeptrack').value.split('\n').map((l) => { const i = l.search(/[:：]/); return i > 0 ? { name: l.slice(0, i).trim().slice(0, 40), state: l.slice(i + 1).trim().slice(0, 120) } : null; }).filter((t) => t && t.name);
      S.variants = null; save(); $('deepst').textContent = '保存しました';
    };
    if ($('loregen')) $('loregen').onclick = async () => {
      S.fillingLore = true; renderSheet();
      try { if (await buildLore(g)) { S.variants = null; save(); } } catch (e) { S.toast = aiMsg(e); }
      S.fillingLore = false; renderSheet();
    };
    if ($('delw')) $('delw').onclick = async (e) => { const b = e.currentTarget; if (b.dataset.armed) { b.disabled = true; b.textContent = '消しています…'; try { await Store.remove(g.id); } catch { /* 無視 */ } renderTitle(); } else { b.dataset.armed = '1'; b.textContent = '本当に消す（元に戻せません）'; } };
  }

  renderTitle();
})();
</script>
