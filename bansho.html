JSON だけを返す: {"personas": [{"id": "id", ${PERSONA_SCHEMA}}]}`, { cache: false, modelTier: 'default' });
    let n = 0;
    arr(r && r.personas).forEach((x) => {
      const e = g.entities.find((y) => y.id === str(x.id));
      if (e && !hasPersona(e)) { e.persona = normPersona(x.persona); if (hasPersona(e)) n++; }
    });
    return n > 0;
  }

  // 1 手の後、人物設定のない人物がいれば作っておく（1 回だけ）
  async function maybeFillPersonas() {
    const g = S.G;
    if (!g || S.fillingPersona) return;
    const missing = g.entities.filter((e) => !hasPersona(e)).slice(0, 8);
    if (!missing.length) return;
    S.fillingPersona = true;
    try { if (await fillPersonas(g, missing) && S.G === g) save(); } catch { /* 次の手でまた */ }
    S.fillingPersona = false;
  }

  async function sendChat(eid, text) {
    text = str(text).trim();
    const g = S.G;
    const e = g && g.entities.find((x) => x.id === eid);
    if (!e || !text || S.chatBusy) return;
    if (!(await getSample())) { S.toast = NO_AI; S.chatDraft = text; return renderSheet(); }
    g.chats[eid] = arr(g.chats[eid]);
    const list = g.chats[eid];
    const before = list.slice();
    list.push({ role: 'me', text: text.slice(0, 400), date: g.date });
    S.chatBusy = true; renderSheet();
    try {
      if (!hasPersona(e)) { try { await fillPersonas(g, [e]); } catch { /* 無くても会話はできる */ } }
      S.ctl = new AbortController();
      const r = await S.sample.json(chatPrompt(g, e, before, text), { signal: S.ctl.signal, cache: false, modelTier: tierOf() });
      list.push({ role: 'them', text: str(r && r.reply, '……').slice(0, 600), date: g.date });
      e.relation = clamp(e.relation + clamp(Math.round(num(r && r.relation_delta, 0)), -5, 5), -100, 100);
      if (r && r.mood) e.mood = str(r.mood).slice(0, 12);
      if (r && str(r.memo).trim()) {
        const memo = str(r.memo).trim().slice(0, 40);
        g.chronicle.push(`${g.turn}｜${g.date}｜${e.name}と話す: ${memo}`);
        e.memory = [...arr(e.memory), `${g.turn}手目の会話: ${memo}`].slice(-8);
      }
      g.chats[eid] = list.slice(-60);
      save({ chat: eid });
    } catch (err) {
      list.pop();
      S.chatDraft = text;
      if (!(err && err.code === 'cancelled')) S.toast = aiMsg(err);
    }
    S.chatBusy = false;
    S.variants = null; // 会話で状態が変わったので作り直しの候補は消す
    renderSheet();
  }

  async function refreshQuests() {
    const g = S.G;
    if (S.busy || S.questBusy) return;
    if (!(await getSample())) { S.toast = NO_AI; return renderSheet(); }
    S.questBusy = true; renderSheet();
    try {
      S.ctl = new AbortController();
      const r = await S.sample.json(`あなたは対話型シミュレーションゲームのゲームマスター。次の世界で、プレイヤーが今引き受けられそうな新しい依頼・仕事・用件を3つ考える。今の状況・人物・勢力の思惑に結びついたものに。

${worldText(g, { short: true })}
【最近の年代記】
${g.chronicle.slice(-6).join('\n') || 'なし'}

JSON だけを返す: {"quests": [{"title": "名前（20字以内）", "desc": "内容（50字以内）", "client": "依頼主", "reward": "報酬（金額か言葉）"}]}`, { signal: S.ctl.signal, cache: false, modelTier: 'quick' });
      const fresh = arr(r && r.quests).slice(0, 3).map(normQuest);
      g.quests = [...fresh, ...g.quests.filter((q) => q.status !== 'open')].slice(0, 12);
      save();
    } catch (err) {
      if (!(err && err.code === 'cancelled')) S.toast = aiMsg(err);
    }
    S.questBusy = false; renderSheet();
  }

  // ================= ゲーム画面 =================
  const TABS = [
    ['time', 'clock', '時間'], ['stat', 'chart', '数値'], ['people', 'people', '人物'], ['chat', 'chat', '会話'],
    ['wallet', 'wallet', '資金'], ['items', 'bag', '持ち物'], ['quest', 'board', '依頼'], ['log', 'book', '年代記'],
  ];
  const SHEET_TITLE = { time: ['clock', '時間'], stat: ['chart', 'ステータス'], people: ['people', '人物'], chat: ['chat', '会話'], wallet: ['wallet', '資金'], items: ['bag', '持ち物'], quest: ['board', '依頼の掲示板'], log: ['book', '年代記と噂'], settings: ['gear', '設定'] };

  function chipsHead(date, loc, moved) {
    return `<div class="heads"><span class="datechip">${ic('clock')}${esc(date)}</span>${loc ? `<span class="locchip">📍${esc(loc)}</span>` : ''}</div>${moved ? `<div class="moved">移動: ${esc(moved.from)} → <b>${esc(moved.to)}</b></div>` : ''}`;
  }
  function storyCard(text, date, loc) {
    const body = esc(text).replace(/「([^」\n]{1,24})」/g, '<em>「$1」</em>');
    return `<div class="story">${chipsHead(date, loc)}<div class="narr">${body}</div></div>`;
  }

  function feedHTML() {
    const g = S.G;
    const lastResIdx = g.log.map((l) => l.t).lastIndexOf('res');
    const limit = S.feedLimit || 60;
    const start = Math.max(0, g.log.length - limit);
    const more = start > 0 ? `<button class="more" id="more">さらに前を読む（あと ${start} 件）</button>` : '';
    const deepAsk = g.mode !== 'nation' && !g.deep && g.status === 'playing' ? `<div class="explain"><b>${ic('book')}${g.mode === 'work' ? '原作' : '世界の設定'}をもっと詳しく調べられます</b><div>今の資料は簡易版です。4段階で詳しく調べると、能力の仕組み・相性・状態（適応の進み具合など）に沿って判定されるようになります（数分かかります）。</div><button class="btn primary" id="deepgo2" style="justify-self:start;margin-top:6px" ${S.deepStep != null || S.busy ? 'disabled' : ''}>${S.deepStep != null ? `調べています（${S.deepStep + 1}/4）: ${DEEP_STEPS[S.deepStep]}…` : '詳しく調べる'}</button></div>` : '';
    return more + g.log.map((l, i) => {
      if (i < start) return '';
      if (l.t === 'intro') return storyCard(l.text, l.date || '', g.log.find((x) => x.t === 'res') ? '' : g.location);
      if (l.t === 'act') return `<div class="mine">${esc(l.text)}</div>`;
      if (l.t === 'explain') return `<div class="explain"><b>${ic('bulb')}いまの状況の説明</b><div>${esc(l.text)}</div></div>`;
      if (l.t === 'end') return `<div class="end"><span class="muted">終幕</span><h3>${esc(l.title)}</h3><div>${esc(l.text)}</div></div>`;
      if (l.t !== 'res') return '';
      const label = { success: '成功', partial: '一部成功', failure: '失敗' }[l.outcome];
      const chips = arr(l.chips).map((c) => c.text ? `<span class="chip ${c.delta > 0 ? 'up' : 'down'}">${esc(c.label)}</span>` : `<span class="chip ${c.delta > 0 ? 'up' : 'down'}">${esc(c.label)} ${c.delta > 0 ? '+' : '−'}${c.money ? money(Math.abs(c.delta), g.wallet) : Math.abs(c.delta)}</span>`).join('');
      const ev = arr(l.events).length ? `<div class="events"><h4>各地の動き</h4>${l.events.map((e) => `<div><b>${esc(e.actor)}</b>　${esc(e.text)}</div>`).join('')}</div>` : '';
      const body = esc(l.narrative).replace(/「([^」\n]{1,24})」/g, '<em>「$1」</em>');
      let tools = '';
      if (i === lastResIdx && !S.busy) {
        const v = S.variants;
        const n = v ? v.list.length : 1;
        const k = v ? v.idx + 1 : 1;
        tools = `<div class="tools">
          <button id="vprev" aria-label="前の結果" ${!v || k <= 1 ? 'disabled' : ''}>${ic('left')}</button><span class="pg">${k} / ${n}</span><button id="vnext" aria-label="次の結果" ${!v || k >= n ? 'disabled' : ''}>${ic('right')}</button>
          <button id="regen" aria-label="結果を作り直す" title="同じ行動で結果を作り直す" ${v ? '' : 'disabled'}>${ic('redo')}</button>
          <button id="edit" aria-label="行動を書き直す" title="この行動を書き直す" ${v ? '' : 'disabled'}>${ic('pen')}</button>
          <button id="explain" class="explain-btn" title="今の状況を分かりやすく説明してもらう">？ 状況を説明して</button>
          <span class="sp"></span><span class="muted">${l.turn}手目</span></div>`;
      }
      return `<div class="story">${chipsHead(l.date || g.date, l.location, l.moved)}
        <div class="verdict"><span class="badge ${l.outcome}">${label}</span>${esc(l.reason)}</div>
        ${l.basis ? `<div class="basis"><b>判定の根拠</b>${esc(l.basis)}</div>` : ''}
        <div class="narr">${body}</div>
        ${arr(l.terms).length ? `<div class="terms"><h4>新しく出た言葉</h4>${l.terms.map((t) => `<div><b>${esc(t.term)}</b>${esc(t.meaning)}</div>`).join('')}</div>` : ''}
        ${l.situation ? `<div class="situation"><b>いまの状況</b>${esc(l.situation)}</div>` : ''}
        ${chips ? `<div class="chips">${chips}</div>` : ''}${ev}</div>${tools}`;
    }).join('') + deepAsk;
  }

  function renderGame() {
    const g = S.G;
    if (!g) return renderTitle();
    const ended = g.status !== 'playing';
    const sugg = !ended && !S.busy ? `<div class="sugg pad"><button class="go" id="progress">${ic('arrowR')}物語を進める</button>${S.showSugg ? arr(g.suggestions).map((s) => `<button data-sugg="${esc(s)}">${esc(s)}</button>`).join('') : ''}</div>` : '';
    const openQ = g.quests.filter((q) => q.status === 'open').length;
    app.innerHTML = `
      <div class="appbar pad"><button class="back" id="home" aria-label="題へ戻る">${ic('back')}</button><h1>${esc(g.title)}</h1>
        ${saveBadge()}
        <button class="tier" id="tier" title="AI の考え方">${ic('spark')}${TIERS[tierOf()]}</button>
        <button class="gear" id="gear" aria-label="設定">${ic('gear')}</button></div>
      <div class="feed pad" id="feed">${feedHTML()}<div id="live">${S.busy ? `<div class="thinking"><span class="dots"><i></i><i></i><i></i></span>${S.sample ? '世界が動いている…（AI の利用の確認が出たら「許可」を押してください）' : 'AI を準備しています…'}</div>` : ''}</div>${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ''}</div>
      <div class="composer">
        ${S.aiChecked && !S.sample ? `<div class="pad"><div class="toast">${esc(NO_AI)}</div></div>` : ''}
        ${sugg}
        <div class="inrow pad">
          <button class="ic ${S.showSugg ? 'on' : ''}" id="bulb" aria-label="行動の候補" ${ended || S.busy ? 'disabled' : ''}>${ic('bulb')}</button>
          <textarea id="cmd" rows="1" maxlength="600" placeholder="${ended ? 'この物語は終幕した' : '何をしますか？'}" ${ended || S.busy ? 'disabled' : ''}></textarea>
          ${S.busy ? `<button class="send stop" id="stop">${ic('stop')}止める</button>` : `<button class="send" id="send" ${ended ? 'disabled' : ''}>${ic('send')}送る</button>`}
        </div>
      </div>
      <nav class="tabbar pad" role="tablist">${TABS.map(([k, icn, lb]) => `<button role="tab" data-tab="${k}" aria-selected="${S.sheet === k}">${ic(icn)}<span>${lb}</span>${k === 'quest' && openQ ? '<i class="dot"></i>' : ''}</button>`).join('')}</nav>
      <div id="sheetwrap"></div>`;
    const $ = (id) => document.getElementById(id);
    $('home').onclick = () => { if (S.busy && S.ctl) S.ctl.abort(); renderTitle(); };
    $('gear').onclick = () => openSheet('settings');
    $('tier').onclick = () => { const ks = Object.keys(TIERS); g.settings.tier = ks[(ks.indexOf(tierOf()) + 1) % ks.length]; save(); $('tier').innerHTML = ic('spark') + TIERS[tierOf()]; };
    $('bulb').onclick = () => { S.showSugg = !S.showSugg; renderGame(); };
    const ta = $('cmd');
    if (S.draft) { ta.value = S.draft; S.draft = ''; }
    const fit = () => { ta.style.height = '48px'; ta.style.height = Math.min(140, ta.scrollHeight + 2) + 'px'; };
    ta.addEventListener('input', fit); fit();
    ta.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229 || e.shiftKey) return;
      e.preventDefault();
      sendAction(ta.value);
    });
    if ($('send')) $('send').onclick = () => sendAction(ta.value);
    if ($('stop')) $('stop').onclick = () => S.ctl && S.ctl.abort();
    app.querySelectorAll('[data-sugg]').forEach((b) => b.onclick = () => { ta.value = b.dataset.sugg; S.showSugg = false; fit(); ta.focus(); app.querySelectorAll('[data-sugg]').forEach((x) => x.remove()); $('bulb').classList.remove('on'); });
    if ($('progress')) $('progress').onclick = () => sendAction(ta.value.trim() ? ta.value : PROGRESS);
    app.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => openSheet(S.sheet === b.dataset.tab ? null : b.dataset.tab));
    // 作り直し・切り替え・書き直し
    const v = S.variants;
    if ($('vprev')) $('vprev').onclick = () => { v.idx--; S.G = clone(v.list[v.idx]); save(); renderGame(); };
    if ($('vnext')) $('vnext').onclick = () => { v.idx++; S.G = clone(v.list[v.idx]); save(); renderGame(); };
    if ($('regen')) $('regen').onclick = () => sendAction(v.action, { regen: true });
    if ($('explain')) $('explain').onclick = () => explainSituation();
    if ($('deepgo2')) $('deepgo2').onclick = () => runDeep(g);
    if ($('edit')) $('edit').onclick = () => { S.G = clone(v.base); S.draft = v.action; S.variants = null; save(); renderGame(); };
    const feed = $('feed');
    if ($('more')) $('more').onclick = () => {
      const h = feed.scrollHeight;
      S.feedLimit = (S.feedLimit || 60) + 60;
      S.keepScroll = true;
      renderGame();
      const f2 = document.getElementById('feed');
      f2.scrollTop = f2.scrollHeight - h;
    };
    if (S.keepScroll) S.keepScroll = false;
    else requestAnimationFrame(() => { feed.scrollTop = feed.scrollHeight; });
    renderSheet();
  }

  function openSheet(k) {
    S.sheet = k; S.full = false; S.toast = ''; S.chatWith = null; S.itemSel = null; S.histOpen = false; S.editPersona = null; S.editPlayer = false; S.editStats = false;
    app.querySelectorAll('.tabbar [data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === k)));
    renderSheet();
  }

  // ---------- パネルの中身 ----------
  function statBarCls(s) {
    const p = (s.value - s.min) / (s.max - s.min);
    return s.fatal && p <= 0.25 ? 'red' : p <= 0.25 ? 'amber' : '';
  }
  function sheetTime(g) {
    const hist = S.histOpen ? `<div class="box chron">${g.chronicle.length ? [...g.chronicle].reverse().map((c) => { const [t, d, x] = c.split('｜'); return `<div><span>${esc(t)}手目<br>${esc(d || '')}</span>${esc(x || c)}</div>`; }).join('') : '<p class="muted">まだ何も記されていない。</p>'}</div>` : '';
    return `<div class="box big-date"><span class="circ">${ic('clock')}</span><span><span class="muted">タイムライン</span><b>${esc(g.date)}</b><span class="muted">${g.location ? '📍' + esc(g.location) + '・' : ''}${g.turn}手目</span></span></div>
      <p class="sec">進行中の筋</p><div class="box chron">${g.threads.length ? g.threads.map((t) => `<div class="ms"><span>▸</span><span style="color:var(--fg);font-size:14px"><b>${esc(t.title)}</b><br><span class="muted">${esc(t.stage)}${t.stuck >= 2 ? '（足踏み中）' : ''}</span></span></div>`).join('') : '<p class="muted">物語が動き出すと、未解決の話の筋がここに並びます。</p>'}</div>
      <button class="pill-btn" id="hist">${ic('rewind')}${S.histOpen ? '履歴を閉じる' : '履歴を見る'}</button>${hist}
      <button class="act-btn" id="skip" ${g.status !== 'playing' ? 'disabled' : ''}><span class="ico">${ic('bolt')}</span><span><b>次の大きな出来事まで進む</b><small>AI が幅を決め、大事な節目で止まります</small></span><span class="chev">${ic('right')}</span></button>
      <div class="field-in"><span style="color:var(--muted);display:inline-flex">${ic('cal')}</span><input id="jump" placeholder="指定した時点へ進む…（例: 一週間後、秋の収穫祭）" maxlength="60"><button id="jumpgo" aria-label="進む">${ic('arrowR')}</button></div>
      <label class="selrow">${ic('gauge')}<b>展開の速さ</b><select id="pace">${Object.entries(TEMPOS).map(([k, v]) => `<option value="${k}" ${tempoOf(g) === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <p class="muted" style="margin:-4px 4px 0">テンポよく: 途中を飛ばしてどんどん進む／ふつう: 1手で場面が1つ進む／じっくり: 会話や描写を丁寧に。</p>`;
  }
  function playerBlock(g) {
    const p = g.player || {};
    if (S.editPlayer) return `<div class="box mem pedit"><b>あなたの人物を直す（AI はこれを必ず守ります）</b>${PLAYER_KEYS.map(([k, n]) => `<label>${n}<textarea data-plk="${k}" maxlength="300" rows="3">${esc(p[k] || '')}</textarea></label>`).join('')}
      <div class="row"><button class="btn primary" id="plsave">保存</button><button class="btn" id="plcancel">やめる</button></div></div>`;
    if (!hasPlayer(g)) return `<div class="box mem"><div>まだありません。次の1手のあとに AI が作ります。</div><button class="btn" id="pledit" style="justify-self:start;margin-top:4px">${ic('pen')}自分で書く</button></div>`;
    return `<div class="box mem">${PLAYER_KEYS.map(([k, n]) => (p[k] ? `<div><span class="pk">${n}</span>${esc(p[k])}</div>` : '')).join('')}<button class="btn" id="pledit" style="justify-self:start;margin-top:4px">${ic('pen')}直す</button></div>`;
  }

  function sheetStat(g) {
    const nums = g.stats.map((s) => `<div class="sitem"><div class="top"><span>${esc(s.name)}</span><b class="${statBarCls(s) === 'red' ? 'low' : ''}">${s.value}</b></div><div class="bar ${statBarCls(s)}"><i style="width:${(((s.value - s.min) / (s.max - s.min)) * 100).toFixed(1)}%"></i></div><div class="desc">${esc(s.desc)}${s.fatal ? '（0で終幕）' : ''}</div></div>`).join('');
    const prof = g.profile.map((p) => `<div class="sitem"><div class="top"><span>${esc(p.label)}</span><span class="txt">${esc(p.value)}</span></div></div>`).join('');
    const traits = TRAITS.map(([k, n]) => `<div class="sitem"><div class="top"><span>${n}</span><b>${g.traits[k]}</b></div><div class="bar"><i style="width:${g.traits[k]}%"></i></div></div>`).join('');
    const quick = S.editStats || S.editPlayer ? '' : `<div class="quick"><button id="statedit2">${ic('pen')}数値を直す</button><button id="pledit2">${ic('pen')}あなたの人物を直す</button><button id="tojudge">${ic('bolt')}判定・消耗</button></div>`;
    const edit = S.editStats ? `<div class="box mem pedit"><b>数値を直す</b>${g.stats.map((st) => `<label style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${esc(st.name)}<input type="number" data-sv="${esc(st.key)}" value="${st.value}" min="${st.min}" max="${st.max}" style="width:6em;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface)"><span style="font-weight:400">（${st.min}〜${st.max}）</span><span style="display:inline-flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" data-sd="${esc(st.key)}" ${st.drain ? 'checked' : ''}>消耗する値</span></label>`).join('')}
      <div class="row"><button class="btn primary" id="statsave">保存</button><button class="btn" id="statcancel">やめる</button></div></div>` : '';
    return `${quick}
      <div class="box"><div class="sgrid">${nums}</div></div>
      ${edit}
      <p class="sec">あなたの人物（強さの判定に毎手使います）</p>${playerBlock(g)}
      ${g.trackers.length ? `<p class="sec">状態の記録（毎手、判定に使われます）</p><div class="box mem">${g.trackers.map((t) => `<div><span class="pk">${esc(t.name)}</span>${esc(t.state)}</div>`).join('')}</div>` : ''}
      <p class="sec" id="judgeanchor">判定と消耗</p>
      ${judgeControls(g)}
      ${prof ? `<p class="sec">プロフィール</p><div class="box"><div class="sgrid">${prof}</div></div>` : ''}
      <p class="sec">世界から見たあなた（50が普通）</p><div class="box"><div class="sgrid">${traits}</div><p class="muted" style="margin:8px 0 0">${esc(g.perception)}</p></div>
      <p class="sec">立場と目的</p><div class="box"><div>${esc(g.role)}</div>${g.goal ? `<div class="muted" style="margin-top:6px">目指すもの：${esc(g.goal)}</div>` : ''}</div>`;
  }
  function relColor(r) { return r >= 40 ? 'var(--good)' : r >= 0 ? 'var(--accent)' : r > -40 ? 'var(--warn)' : 'var(--bad)'; }
  function personaBlock(e) {
    if (S.editPersona === e.id) {
      const p = e.persona || {};
      return `<div class="mem pedit"><b>人物設定を直す（AI はこれを必ず守ります）</b>${PERSONA_KEYS.map(([k, n]) => `<label>${n}<textarea data-pk="${k}" maxlength="120" rows="2">${esc(p[k] || '')}</textarea></label>`).join('')}
        <div class="row"><button class="btn primary" data-psave="${esc(e.id)}">保存</button><button class="btn" data-pcancel="1">やめる</button></div></div>`;
    }
    if (!hasPersona(e)) return `<div class="mem"><b>人物設定</b><div>まだありません。話しかけると AI が作ります。</div><button class="btn" data-pedit="${esc(e.id)}" style="justify-self:start;margin-top:4px">自分で書く</button></div>`;
    return `<div class="mem"><b>人物設定</b>${PERSONA_KEYS.map(([k, n]) => (e.persona[k] ? `<div><span class="pk">${n}</span>${esc(e.persona[k])}</div>` : '')).join('')}<button class="btn" data-pedit="${esc(e.id)}" style="justify-self:start;margin-top:4px">${ic('pen')}直す</button></div>`;
  }

  function sheetPeople(g) {
    return [...g.entities].sort((a, b) => b.power - a.power).map((e) => {
      const r = e.relation;
      const left = r >= 0 ? 50 : 50 + r / 2;
      return `<div class="box pcard"><div class="row">${avatar(e.name, e.kind)}<div style="flex:1;min-width:0"><span class="nm">${esc(e.name)}</span><span class="kind">${esc(e.kind)}</span>${e.isNew === g.turn ? ' <span class="badge partial">新</span>' : ''}${e.status && e.status !== '生存' ? ` <span class="badge ${e.status === '死亡' ? 'failure' : 'partial'}">${esc(e.status)}</span>` : ''}</div></div>
        <div class="kv"><div class="top">好感度<b class="${r > 0 ? 'pos' : r < 0 ? 'neg' : ''}">${r > 0 ? '+' : ''}${r}</b></div><div class="cbar"><i style="left:${left}%;width:${Math.abs(r) / 2}%;background:${relColor(r)}"></i></div></div>
        <div class="kv"><div class="top">影響力<b>${e.power}</b></div><div class="bar amber"><i style="width:${e.power}%"></i></div></div>
        <div class="tline"><span>関係</span><b>${esc(e.bond || '—')}</b></div>
        <div class="tline"><span>態度</span><b>${esc(e.attitude || '—')}</b></div>
        <div class="tline"><span>気分</span><b>${esc(e.mood || '—')}</b></div>
        <div class="muted">${esc(e.note ? '最近: ' + e.note : e.desc)}</div>
        ${personaBlock(e)}
        ${g.deep && g.deep.dossiers[e.id] ? `<details class="mem"><summary><b>人物資料（原作の能力・戦績）</b></summary><div style="white-space:pre-wrap">${esc(g.deep.dossiers[e.id])}</div></details>` : ''}
        ${arr(e.memory).length ? `<div class="mem"><b>${esc(e.name)}が覚えていること</b>${arr(e.memory).slice().reverse().map((m) => `<div>${esc(m)}</div>`).join('')}</div>` : ''}
        ${e.status === '死亡' ? '' : `<button class="talk" data-talk="${esc(e.id)}">${ic('chat')}話しかける</button>`}</div>`;
    }).join('');
  }
  function sheetChat(g) {
    if (S.chatWith) {
      const e = g.entities.find((x) => x.id === S.chatWith);
      if (!e) { S.chatWith = null; return sheetChat(g); }
      const list = arr(g.chats[e.id]);
      let lastDate = '';
      const msgs = list.map((m) => { const d = m.date !== lastDate ? `<div class="msg-date">${esc(m.date)}</div>` : ''; lastDate = m.date; return d + `<div class="msg ${m.role === 'me' ? 'me' : 'them'}">${esc(m.text)}</div>`; }).join('');
      return `<div class="chatview"><div class="row"><button class="btn" id="cback">← 一覧</button>${avatar(e.name, e.kind, 'sm')}<div><b>${esc(e.name)}</b><div class="muted">好感 ${e.relation > 0 ? '+' : ''}${e.relation}・${esc(e.mood || '—')}</div></div></div>
        <div class="msgs" id="msgs">${msgs || `<p class="muted">${esc(e.name)}に話しかけてみよう。会話の内容は好感や物語に影響する。</p>`}${S.chatBusy ? '<div class="thinking"><span class="dots"><i></i><i></i><i></i></span>返事を待っている…</div>' : ''}${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ''}</div>
        <div class="cin"><input id="cmsg" maxlength="400" placeholder="${esc(e.name)}に話す" ${S.chatBusy ? 'disabled' : ''}><button class="send" id="csend" ${S.chatBusy ? 'disabled' : ''}>${ic('send')}送る</button></div>
        ${list.length && !S.chatBusy && g.status === 'playing' ? `<button class="pill-btn" id="chatgo">${ic('arrowR')}話した内容を実行に移して、物語を進める</button>` : ''}</div>`;
    }
    const withMsg = g.entities.filter((e) => arr(g.chats[e.id]).length).sort((a, b) => arr(g.chats[b.id]).length - arr(g.chats[a.id]).length);
    const rest = g.entities.filter((e) => !arr(g.chats[e.id]).length);
    const row = (e) => { const list = arr(g.chats[e.id]); const last = list[list.length - 1]; if (e.status === '死亡') return `<div class="citem" style="opacity:.5">${avatar(e.name, e.kind)}<span class="mid"><span class="t"><b>${esc(e.name)}</b><small>死亡</small></span><p>${last ? esc(last.text) : '…'}</p></span></div>`; return `<button class="citem" data-chat="${esc(e.id)}">${avatar(e.name, e.kind)}<span class="mid"><span class="t"><b>${esc(e.name)}</b><small>${last ? esc(last.date) : ''}</small></span><p>${last ? esc(last.text) : '…'}</p></span><span style="color:var(--muted)">${ic('right')}</span></button>`; };
    return `<div class="clist">${[...withMsg, ...rest].map(row).join('')}</div>`;
  }
  function sheetWallet(g) {
    const w = g.wallet;
    const tx = w.history.map((h) => `<div class="box tx"><span class="ar ${h.amount >= 0 ? 'in' : 'out'}">${ic(h.amount >= 0 ? 'up' : 'down')}</span><span class="mid"><b>${esc(h.label)}</b><span class="muted">${esc(h.date)}</span></span><span class="amt ${h.amount >= 0 ? 'in' : 'out'}">${h.amount >= 0 ? '+' : '−'}${money(Math.abs(h.amount), w)}</span></div>`).join('');
    return `<div class="balance"><span class="wm">${esc(w.symbol || [...(w.unit || '¤')][0])}</span><small>${ic('wallet')}残高</small><b>${money(w.balance, w)}</b></div>
      <p class="sec">取引履歴</p>${tx || '<p class="muted">まだ取引はない。</p>'}`;
  }
  function sheetItems(g) {
    const sel = S.itemSel != null ? g.items[S.itemSel] : null;
    const detail = sel ? `<div class="box idetail"><div class="row"><span class="em">${esc(sel.icon)}</span><div><b>${esc(sel.name)}</b><div class="muted">${esc(sel.desc)}</div></div></div><div class="row"><button class="pill-btn" id="useitem" style="flex:1">使う（行動に書き込む）</button><button class="btn danger" id="dropitem">${S.dropArmed ? '本当に捨てる' : '捨てる'}</button></div></div>` : '';
    const empties = Math.max(0, ITEM_MAX - g.items.length);
    const full = g.items.length >= ITEM_MAX;
    return `<p class="muted" style="margin:0">持ち物 <b style="color:var(--fg)">${g.items.length} / ${ITEM_MAX}</b>　物語の鍵になる大事な物だけを持てます。${full ? '<span style="color:var(--bad)">いっぱいです。新しい物を手に入れるには、どれかを捨ててください。</span>' : ''}</p>
      ${detail}<div class="igrid">${g.items.map((it, i) => `<button class="item" data-item="${i}"><span class="em">${esc(it.icon)}</span><b>${esc(it.name)}</b></button>`).join('')}${'<div class="item empty"></div>'.repeat(empties)}</div>`;
  }
  function sheetQuest(g) {
    const notes = g.quests.map((q) => `<div class="note"><h4>${esc(q.title)}</h4><p>${esc(q.desc)}</p><div class="by">by ${esc(q.client)}${q.reward ? ` ・ <b>${esc(q.reward)}</b>` : ''}</div>
      ${q.status === 'open' ? `<button class="accept" data-accept="${esc(q.id)}" ${g.status !== 'playing' ? 'disabled' : ''}>引き受ける</button>` : `<span class="stamp ${q.status}">${{ taken: '引き受け中', done: '達成', failed: '失敗' }[q.status]}</span>`}</div>`).join('');
    return `<div class="board"><h3>依 頼 の 掲 示 板</h3>${notes || '<div class="note"><p>いまは依頼が貼られていない。右上の更新で新しい依頼を探せる。</p></div>'}</div>${S.questBusy ? '<div class="thinking" style="color:#fff">新しい依頼を探している…</div>' : ''}${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ''}`;
  }
  function sheetLog(g) {
    const news = g.news.length ? g.news.map((n) => `<div class="news-item"><b>${esc(n.source)}・${n.turn}手目</b>${esc(n.headline)}</div>`).join('') : '<p class="muted">まだ噂は立っていない。</p>';
    const chron = g.chronicle.length ? [...g.chronicle].reverse().map((c) => { const [t, d, x] = c.split('｜'); return `<div><span>${esc(t)}手目</span>${esc(x || c)}</div>`; }).join('') : '<p class="muted">まだ何も記されていない。</p>';
    const gl = `<p class="sec">用語と手がかり</p><div class="box chron">${g.glossary.length ? g.glossary.slice().reverse().map((t) => `<div><span>${t.turn ? t.turn + '手目' : ''}</span><span style="color:var(--fg);font-size:14px"><b>${esc(t.term)}</b>　${esc(t.meaning)}</span></div>`).join('') : '<p class="muted">物語に新しい言葉や手がかりが出ると、ここに意味と一緒にたまります。</p>'}</div>`;
    const syn = gl + `<p class="sec">これまでのあらすじ</p><div class="box synopsis">${g.synopsis ? esc(g.synopsis) : '<span class="muted">年代記がたまると、古い出来事がここにあらすじとしてまとめられ、AI が長く覚えていられるようになります。</span>'}</div>`;
    const ms = `<p class="sec">決定的な出来事</p><div class="box chron">${g.milestones.length ? g.milestones.slice().reverse().map((m) => `<div class="ms"><span>★</span>${esc(m)}</div>`).join('') : '<p class="muted">まだない。</p>'}</div>`;
    return syn + ms + `<p class="sec">噂と知らせ</p><div class="box" style="display:grid;gap:10px">${news}</div><p class="sec">年代記</p><div class="box chron">${chron}</div>`;
  }
  function judgeControls(g) {
    return `<label class="selrow">${ic('bolt')}<b>判定</b><select id="judgesel">${Object.entries(JUDGES).map(([k, v]) => `<option value="${k}" ${judgeOf(g) === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <p class="muted" style="margin:-4px 4px 0">公平: 数値と状況で判定／主人公寄り: 設定上の強さで勝てる相手には勝つ／思い通り: ありえないこと以外は書いた通りに成功。</p>
      <label class="selrow">${ic('gauge')}<b>消耗</b><select id="drainsel">${Object.entries(DRAINS).map(([k, v]) => `<option value="${k}" ${drainOf(g) === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <p class="muted" style="margin:-4px 4px 0">呪力・体力など「消耗する値」の減り方。どの値が消耗する値かは、数値タブの「数値を直す」で選べます。</p>`;
  }

  function deepBlock(g) {
    const work = g.mode === 'work';
    if (g.mode === 'nation') return '';
    const running = S.deepStep != null;
    const head = `<div class="box" style="display:grid;gap:8px"><b>${work ? '原作の詳しい資料' : '世界の詳しい資料'}</b>
      <span class="muted">${work ? '原作' : 'この世界の設定'}を4段階（世界のルール → 人物ごとの資料 → 相性と状態の記録 → 見直し）で詳しく調べた資料です。毎手、判定の前にこれを照らし合わせます。AI はネットを調べられないため、AI が知っている知識から作ります。間違いは書き直してください。</span>
      <button class="btn primary" id="deepgo" style="justify-self:start" ${running || S.busy ? 'disabled' : ''}>${running ? `調べています（${S.deepStep + 1}/4）: ${DEEP_STEPS[S.deepStep]}…` : g.deep ? '詳しく調べ直す（数分）' : '詳しく調べる（数分）'}</button>`;
    if (!g.deep) return head + '</div>';
    const ta = (id, v, rows) => `<textarea id="${id}" rows="${rows}" maxlength="3000" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface-2);font-size:13.5px;line-height:1.7">${esc(v)}</textarea>`;
    return head + `
      <label class="muted">世界のルール${ta('deeprules', g.deep.rules, 8)}</label>
      <label class="muted">あなたの人物の資料${ta('deepplayer', g.deep.player, 6)}</label>
      <label class="muted">相性分析${ta('deepmatch', g.deep.matchups, 8)}</label>
      <label class="muted">状態の記録（1行に「名前: 状態」）${ta('deeptrack', g.trackers.map((t) => `${t.name}: ${t.state}`).join('\n'), 4)}</label>
      ${g.deep.notes ? `<div class="muted">見直しで直した点・不確かな点: ${esc(g.deep.notes)}</div>` : ''}
      <div class="muted">登場人物の資料は ${Object.keys(g.deep.dossiers).length} 人分あります（人物タブの各カードで見られます）。</div>
      <div class="row"><button class="btn primary" id="deepsave">保存</button><span class="muted" id="deepst"></span></div></div>`;
  }

  async function runDeep(g) {
    if (S.deepStep != null || S.busy) return;
    S.deepStep = 0; S.toast = '';
    const refresh = () => { if (S.G !== g) return; if (S.sheet) renderSheet(); else renderGame(); };
    refresh();
    try {
      await buildDeep(g, (i) => { S.deepStep = i; refresh(); });
      S.variants = null; if (S.G === g) save();
    } catch (e) { S.toast = aiMsg(e); }
    S.deepStep = null;
    if (S.G === g) renderGame();
  }

  function sheetSettings(g) {
    return `${deepBlock(g)}
      ${judgeControls(g)}
      <label class="selrow">${ic('spark')}<b>AI の考え方</b><select id="tiersel">${Object.entries(TIERS).map(([k, v]) => `<option value="${k}" ${tierOf() === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <p class="muted" style="margin:-4px 4px 0">速い: すぐ返るが判定は大まか／標準: ふつう／じっくり: 時間はかかるが筋の通った展開に。</p>
      <div class="box"><b>${esc(g.title)}</b><div class="muted" style="margin-top:4px">${esc(g.premise)}</div></div>
      ${g.mode === 'work' && !g.deep ? `<div class="box" style="display:grid;gap:6px"><b>原作資料（簡易版）</b><span class="muted">AI が知っている原作の知識をまとめたもの。毎手これに従います。間違いや足りない設定は書き直してください（例: 人物の術式・強さ・世界のルール）。</span>
        <textarea id="lore" rows="10" maxlength="3000" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--surface-2);font-size:13.5px;line-height:1.7">${esc(g.lore)}</textarea>
        <div class="row" style="flex-wrap:wrap"><button class="btn primary" id="loresave">保存</button><button class="btn" id="loregen" ${S.busy || S.fillingLore ? 'disabled' : ''}>${S.fillingLore ? 'まとめています…' : 'AI に作り直させる'}</button><span class="muted" id="lorest"></span></div></div>` : ''}
      <div class="box"><b>記録の保存先</b><div class="muted" style="margin-top:4px">${Store.cloud ? 'claude.ai のあなた専用の保存場所（あなた以外は読めません）。PC とスマホで同じ続きを遊べます。' : 'このブラウザの中だけ。ブラウザのデータを消すと失われます。'}<br>物語 ${g.log.length} 件・年代記 ${g.chronicle.length} 行・あらすじに畳んだ出来事 ${g.synopsisUpTo} 件</div></div>
      <div class="box"><b>この画面の版</b><div class="muted" style="margin-top:4px">${APP_VERSION}。表示が古いと感じたら、このページを閉じて開き直してください。</div></div>
      <button class="act-btn" id="tohome"><span class="ico">${ic('back')}</span><span><b>題へ戻る</b><small>記録は自動で保存されています</small></span></button>
      <button class="btn danger" id="delw" style="justify-self:start">この世界の記録を消す</button>`;
  }

  function renderSheet() {
    const wrap = document.getElementById('sheetwrap');
    if (!wrap) return;
    const g = S.G;
    if (!S.sheet || !g) { wrap.innerHTML = ''; return; }
    const tabbar = app.querySelector('.tabbar');
    app.style.setProperty('--tabh', (tabbar ? tabbar.offsetHeight : 64) + 'px');
    const k = S.sheet;
    const [icn, ttl] = SHEET_TITLE[k];
    const body = { time: sheetTime, stat: sheetStat, people: sheetPeople, chat: sheetChat, wallet: sheetWallet, items: sheetItems, quest: sheetQuest, log: sheetLog, settings: sheetSettings }[k](g);
    const extra = k === 'quest' ? `<button id="qref" aria-label="依頼を更新" ${S.questBusy ? 'disabled' : ''}>${ic('refresh')}</button>` : '';
    wrap.innerHTML = `<div class="scrim" id="scrim"></div><div class="sheet${S.full ? ' full' : ''}" data-k="${k}" role="dialog" aria-label="${ttl}"><div class="grab"></div>
      <div class="sh"><span class="ttl">${ic(icn)}${ttl}</span>${extra}<button id="sfull" aria-label="${S.full ? '小さくする' : '大きくする'}">${ic(S.full ? 'shrink' : 'expand')}</button><button id="sclose" aria-label="閉じる">${ic('minus')}</button></div>
      <div class="body" id="sbody">${body}</div></div>`;
    const $ = (id) => document.getElementById(id);
    $('scrim').onclick = () => openSheet(null);
    $('sclose').onclick = () => openSheet(null);
    $('sfull').onclick = () => { S.full = !S.full; renderSheet(); };
    // 種類ごとの操作
    if ($('hist')) $('hist').onclick = () => { S.histOpen = !S.histOpen; renderSheet(); };
    if ($('skip')) $('skip').onclick = () => sendAction('（時間を進める）次の大きな出来事が起きるまで時間を進める。その間の日々は要約して語る。');
    if ($('jumpgo')) $('jumpgo').onclick = () => { const v = $('jump').value.trim(); if (v) sendAction(`（時間を進める）「${v}」まで時間を進める。その間の出来事は要約して語る。`); };
    if ($('pace')) $('pace').onchange = (e) => { g.settings.tempo = e.target.value; save(); };
    app.querySelectorAll('[data-pedit]').forEach((b) => b.onclick = () => { S.editPersona = b.dataset.pedit; renderSheet(); });
    app.querySelectorAll('[data-pcancel]').forEach((b) => b.onclick = () => { S.editPersona = null; renderSheet(); });
    app.querySelectorAll('[data-psave]').forEach((b) => b.onclick = () => {
      const e = g.entities.find((x) => x.id === b.dataset.psave);
      if (!e) return;
      const box = b.closest('.pedit');
      const p = {};
      box.querySelectorAll('[data-pk]').forEach((t) => (p[t.dataset.pk] = t.value));
      e.persona = normPersona(p);
      S.editPersona = null; S.variants = null;
      save(); renderSheet();
    });
    app.querySelectorAll('[data-talk]').forEach((b) => b.onclick = () => { S.sheet = 'chat'; S.chatWith = b.dataset.talk; app.querySelectorAll('.tabbar [data-tab]').forEach((x) => x.setAttribute('aria-selected', String(x.dataset.tab === 'chat'))); renderSheet(); });
    app.querySelectorAll('[data-chat]').forEach((b) => b.onclick = () => { S.chatWith = b.dataset.chat; S.toast = ''; renderSheet(); });
    if ($('chatgo')) $('chatgo').onclick = () => { const e = g.entities.find((x) => x.id === S.chatWith); if (e) sendAction(`（${e.name}との会話を踏まえて）話し合ったことを実行に移し、物語を進める。`); };
    if ($('cback')) $('cback').onclick = () => { S.chatWith = null; S.toast = ''; renderSheet(); };
    if ($('csend')) {
      const inp = $('cmsg');
      if (S.chatDraft) { inp.value = S.chatDraft; S.chatDraft = ''; }
      const go = () => { S.toast = ''; sendChat(S.chatWith, inp.value); };
      $('csend').onclick = go;
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); go(); } });
      const sb = $('sbody'); sb.scrollTop = sb.scrollHeight;
      if (!S.chatBusy) inp.focus({ preventScroll: true });
    }
    app.querySelectorAll('[data-item]').forEach((b) => b.onclick = () => { S.itemSel = +b.dataset.item; S.dropArmed = false; renderSheet(); });
    if ($('dropitem')) $('dropitem').onclick = () => {
      if (!S.dropArmed) { S.dropArmed = true; return renderSheet(); }
      const it = g.items[S.itemSel];
      if (it) { g.items.splice(S.itemSel, 1); g.chronicle.push(`${g.turn}｜${g.date}｜「${it.name}」を手放した`); }
      S.itemSel = null; S.dropArmed = false; S.variants = null; save(); renderSheet();
    };
    if ($('useitem')) $('useitem').onclick = () => { const it = g.items[S.itemSel]; openSheet(null); const ta = $('cmd'); if (ta && it) { ta.value = `「${it.name}」を使って、`; ta.focus(); } };
    app.querySelectorAll('[data-accept]').forEach((b) => b.onclick = () => { const q = g.quests.find((x) => x.id === b.dataset.accept); if (q) sendAction(`依頼「${q.title}」（依頼主: ${q.client}）を引き受ける。`); });
    if ($('qref')) $('qref').onclick = () => { S.toast = ''; refreshQuests(); };
    if ($('judgesel')) $('judgesel').onchange = (e) => { g.settings.judge = e.target.value; S.variants = null; save(); };
    if ($('drainsel')) $('drainsel').onchange = (e) => { g.settings.drain = e.target.value; S.variants = null; save(); };
    if ($('statedit')) $('statedit').onclick = () => { S.editStats = true; renderSheet(); };
    if ($('statedit2')) $('statedit2').onclick = () => { S.editStats = true; S.full = true; renderSheet(); };
    if ($('pledit2')) $('pledit2').onclick = () => { S.editPlayer = true; S.full = true; renderSheet(); const el = app.querySelector('[data-plk]'); if (el) { el.scrollIntoView({ block: 'center' }); } };
    if ($('tojudge')) $('tojudge').onclick = () => { const el = document.getElementById('judgeanchor'); if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); };
    if ($('statcancel')) $('statcancel').onclick = () => { S.editStats = false; renderSheet(); };
    if ($('statsave')) $('statsave').onclick = () => {
      app.querySelectorAll('[data-sv]').forEach((inp) => { const st = g.stats.find((x) => x.key === inp.dataset.sv); if (st) st.value = clamp(Math.round(num(inp.value, st.value)), st.min, st.max); });
      app.querySelectorAll('[data-sd]').forEach((cb) => { const st = g.stats.find((x) => x.key === cb.dataset.sd); if (st) st.drain = cb.checked; });
      g.chronicle.push(`${g.turn}｜${g.date}｜（数値を手で直した）`);
      S.editStats = false; S.variants = null; save(); renderSheet();
    };
    if ($('tiersel')) $('tiersel').onchange = (e) => { g.settings.tier = e.target.value; save(); const t = $('tier'); if (t) t.innerHTML = ic('spark') + TIERS[tierOf()]; };
    if ($('tohome')) $('tohome').onclick = () => renderTitle();
    if ($('pledit')) $('pledit').onclick = () => { S.editPlayer = true; renderSheet(); };
    if ($('plcancel')) $('plcancel').onclick = () => { S.editPlayer = false; renderSheet(); };
    if ($('plsave')) $('plsave').onclick = () => {
      const p = {};
      app.querySelectorAll('[data-plk]').forEach((t) => (p[t.dataset.plk] = t.value));
      g.player = normPlayer(p); S.editPlayer = false; S.variants = null; save(); renderSheet();
    };
    if ($('loresave')) $('loresave').onclick = () => { g.lore = $('lore').value.trim().slice(0, 3000); S.variants = null; save(); $('lorest').textContent = '保存しました'; };
    if ($('deepgo')) $('deepgo').onclick = () => runDeep(g);
    if ($('deepsave')) $('deepsave').onclick = () => {
      g.deep.rules = $('deeprules').value.trim().slice(0, 3000);
      g.deep.player = $('deepplayer').value.trim().slice(0, 1500);
      g.deep.matchups = $('deepmatch').value.trim().slice(0, 3000);
      g.trackers = $('deeptrack').value.split('\n').map((l) => { const i = l.search(/[:：]/); return i > 0 ? { name: l.slice(0, i).trim().slice(0, 40), state: l.slice(i + 1).trim().slice(0, 120) } : null; }).filter((t) => t && t.name);
      S.variants = null; save(); $('deepst').textContent = '保存しました';
    };
    if ($('loregen')) $('loregen').onclick = async () => {
      S.fillingLore = true; renderSheet();
      try { if (await buildLore(g)) { S.variants = null; save(); } } catch (e) { S.toast = aiMsg(e); }
      S.fillingLore = false; renderSheet();
    };
    if ($('delw')) $('delw').onclick = async (e) => { const b = e.currentTarget; if (b.dataset.armed) { b.disabled = true; b.textContent = '消しています…'; try { await Store.remove(g.id); } catch { /* 無視 */ } renderTitle(); } else { b.dataset.armed = '1'; b.textContent = '本当に消す（元に戻せません）'; } };
  }

  renderTitle();
})();
</script>
