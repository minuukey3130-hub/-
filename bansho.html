<title>万象録</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 物語を読むアプリ: 中央に物語のカード、下にアイコンのタブ。タブを押すと下からパネルがせり上がる。 */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --surface-2: #f6f7fb;
  --line: #e3e5ee;
  --fg: #1d2030;
  --muted: #6b7087;
  --accent: #4f5bd5;
  --accent-2: #7a85f0;
  --accent-soft: #e8eafc;
  --good: #2f9e6a;
  --good-soft: #e2f5ec;
  --warn: #d68a1c;
  --warn-soft: #fcf0dc;
  --bad: #d9534f;
  --bad-soft: #fbe5e4;
  --track: #e8e9f0;
  --shadow: 0 2px 10px rgba(29, 32, 48, 0.06), 0 1px 2px rgba(29, 32, 48, 0.05);
  --t-time: #fbeee0; --t-time-fg: #c4701f;
  --t-stat: #e2f4ea; --t-stat-fg: #2c8a5a;
  --t-people: #ece6fb; --t-people-fg: #6a4fd0;
  --t-chat: #e3eefb; --t-chat-fg: #2e6fbe;
  --t-wallet: #e2f3f1; --t-wallet-fg: #23877b;
  --t-items: #f7ecdc; --t-items-fg: #a8692a;
  --t-quest: #f2e6d6; --t-quest-fg: #8f5a26;
  --t-log: #eceef3; --t-log-fg: #505672;
  --cork: #9c7a52; --cork-dark: #7d5f3c;
  --font: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12131a; --surface: #1c1e28; --surface-2: #232633; --line: #2f3242; --fg: #e8e9f2; --muted: #9a9fb8;
    --accent: #8f98ff; --accent-2: #aab1ff; --accent-soft: #272b4a; --good: #5fcf98; --good-soft: #1b3328;
    --warn: #f0b25a; --warn-soft: #3a2e1a; --bad: #f08a86; --bad-soft: #3d2222; --track: #2c2f3e;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    --t-time: #3a2d1f; --t-time-fg: #f0b06a; --t-stat: #1d3328; --t-stat-fg: #72d6a3;
    --t-people: #2c2546; --t-people-fg: #b7a5ff; --t-chat: #1f2c40; --t-chat-fg: #8ebcf5;
    --t-wallet: #1b3532; --t-wallet-fg: #6fd3c4; --t-items: #3a2f20; --t-items-fg: #e7b27a;
    --t-quest: #3a2f22; --t-quest-fg: #e0ae7c; --t-log: #262938; --t-log-fg: #b8bdd6;
    --cork: #6b5236; --cork-dark: #523e28;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12131a; --surface: #1c1e28; --surface-2: #232633; --line: #2f3242; --fg: #e8e9f2; --muted: #9a9fb8;
  --accent: #8f98ff; --accent-2: #aab1ff; --accent-soft: #272b4a; --good: #5fcf98; --good-soft: #1b3328;
  --warn: #f0b25a; --warn-soft: #3a2e1a; --bad: #f08a86; --bad-soft: #3d2222; --track: #2c2f3e;
  --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  --t-time: #3a2d1f; --t-time-fg: #f0b06a; --t-stat: #1d3328; --t-stat-fg: #72d6a3;
  --t-people: #2c2546; --t-people-fg: #b7a5ff; --t-chat: #1f2c40; --t-chat-fg: #8ebcf5;
  --t-wallet: #1b3532; --t-wallet-fg: #6fd3c4; --t-items: #3a2f20; --t-items-fg: #e7b27a;
  --t-quest: #3a2f22; --t-quest-fg: #e0ae7c; --t-log: #262938; --t-log-fg: #b8bdd6;
  --cork: #6b5236; --cork-dark: #523e28;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { height: 100%; width: 100%; max-width: 100%; overflow-x: hidden; }
body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.75; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.app { height: 100%; display: flex; flex-direction: column; max-width: min(820px, var(--appw, 100%)); margin: 0 auto; position: relative; overflow-x: hidden; }
.app > * { min-width: 0; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- 上の帯 ---------- */
.appbar { display: flex; align-items: center; gap: 10px; padding-block: 12px 10px; border-bottom: 3px solid var(--accent-2); background: var(--surface); }
.appbar .back { color: var(--muted); padding: 4px; margin-left: -4px; }
.appbar h1 { font-size: 19px; font-weight: 900; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tier { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; color: var(--fg); background: var(--surface); }
.tier svg { width: 18px; height: 18px; color: var(--accent); }
.gear { color: var(--accent); padding: 4px; }
.savestate { font-size: 11px; color: var(--muted); white-space: nowrap; }
@media (max-width: 400px), (pointer: coarse) { .appbar .savestate { display: none; } .tier { padding: 4px 10px; } }
.app { width: var(--appw, 100%); margin-left: var(--appml, auto); }
.savestate.bad { color: var(--bad); font-weight: 700; }
.more { justify-self: center; font-size: 13px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 14px; }
.mem { display: grid; gap: 2px; font-size: 13px; background: var(--surface-2); border-radius: 12px; padding: 8px 12px; }
.mem b { font-size: 12px; color: var(--muted); }
.synopsis { white-space: pre-wrap; font-size: 14px; line-height: 1.8; }
.feed { grid-template-columns: minmax(0, 1fr); }
.story { grid-template-columns: minmax(0, 1fr); min-width: 0; }
.story > *, .narr, .datechip, .verdict, .situation, .terms, .explain, .events, .mine, .chip { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.tabbar button { min-width: 0; }
.tabbar button span { white-space: nowrap; overflow: hidden; text-overflow: clip; max-width: 100%; }
.basis { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; display: grid; }
.basis b { font-size: 11px; letter-spacing: 0.06em; }
.situation { background: var(--accent-soft); border-radius: 14px; padding: 8px 14px; font-size: 14px; display: grid; gap: 2px; }
.situation b { font-size: 12px; color: var(--accent); letter-spacing: 0.06em; }
.terms { border: 1px dashed var(--line); border-radius: 14px; padding: 8px 14px; font-size: 13.5px; display: grid; gap: 2px; }
.terms h4 { margin: 0; font-size: 12px; color: var(--muted); }
.terms b { margin-right: 8px; }
.explain { background: var(--warn-soft); border-radius: 18px; padding: 12px 16px; display: grid; gap: 4px; font-size: 14.5px; white-space: pre-wrap; }
.explain b { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--warn); }
.explain b svg { width: 18px; height: 18px; }
.tools .explain-btn { font-size: 12.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
.mem .pk { display: inline-block; min-width: 6.5em; color: var(--muted); font-size: 12px; font-weight: 700; }
.pedit label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 4px; }
.pedit textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; background: var(--surface); font-size: 14px; font-weight: 400; color: var(--fg); resize: vertical; }

/* ---------- 物語 ---------- */
.feed { flex: 1; overflow-y: auto; overflow-x: hidden; min-width: 0; padding-block: 16px 20px; display: grid; gap: 14px; align-content: start; -webkit-overflow-scrolling: touch; }
.story { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 14px 18px 18px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.datechip { justify-self: start; display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; padding: 3px 12px; border-radius: 999px; }
.datechip svg { width: 16px; height: 16px; }
.heads { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.locchip { display: inline-flex; align-items: center; gap: 2px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); font-weight: 700; font-size: 13px; padding: 2px 12px; border-radius: 999px; overflow-wrap: anywhere; }
.moved { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 4px 12px; justify-self: start; overflow-wrap: anywhere; }
.moved b { color: var(--fg); }
.narr { white-space: pre-wrap; font-size: 16px; line-height: 1.95; }
.narr em { font-style: normal; color: var(--accent); }
.verdict { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.badge { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.badge.success { background: var(--good-soft); color: var(--good); }
.badge.partial { background: var(--warn-soft); color: var(--warn); }
.badge.failure { background: var(--bad-soft); color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; border-radius: 999px; padding: 1px 10px; background: var(--surface-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.chip.up { color: var(--good); }
.chip.down { color: var(--bad); }
.events { background: var(--surface-2); border-radius: 14px; padding: 10px 14px; display: grid; gap: 4px; font-size: 14px; }
.events h4 { margin: 0 0 2px; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 0.08em; }
.mine { justify-self: end; max-width: 85%; background: var(--accent); color: #fff; padding: 8px 14px; border-radius: 18px 18px 4px 18px; white-space: pre-wrap; font-size: 15px; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; color: var(--muted); padding: 0 6px; margin-top: -4px; }
.tools button { padding: 6px; border-radius: 10px; color: var(--muted); display: inline-flex; }
.tools button:hover { background: var(--surface); color: var(--fg); }
.tools button:disabled { opacity: 0.35; cursor: default; }
.tools .pg { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); }
.tools .sp { flex: 1; }
.end { background: var(--surface); border: 2px solid var(--fg); border-radius: 22px; padding: 20px; text-align: center; display: grid; gap: 6px; }
.end h3 { font-size: 24px; margin: 0; font-weight: 900; }
.thinking { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 14px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bob 1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: 0.15s; } .dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes bob { 50% { transform: translateY(-4px); opacity: 0.4; } }
.toast { background: var(--bad-soft); color: var(--bad); border-radius: 14px; padding: 8px 14px; font-size: 14px; }

/* ---------- 入力 ---------- */
.composer { background: var(--surface-2); border-top: 1px solid var(--line); padding-block: 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.composer > * { min-width: 0; }
.sugg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.sugg button { white-space: nowrap; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--fg); flex: none; }
.sugg button:hover { border-color: var(--accent); }
.sugg .go { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent); border-color: var(--accent-2); font-weight: 700; }
.sugg .go svg { width: 16px; height: 16px; }
.inrow { display: flex; align-items: center; gap: 8px; }
.inrow .ic { color: var(--muted); padding: 4px; border-radius: 10px; display: inline-flex; flex: none; }
.inrow .ic.on { color: var(--accent); background: var(--accent-soft); }
.inrow textarea { flex: 1 1 0; width: 0; min-width: 0; height: 48px; max-height: 140px; resize: none; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 11px 18px; line-height: 1.5; box-shadow: var(--shadow); }
.inrow textarea:disabled { opacity: 0.6; }
.send { display: inline-flex; align-items: center; gap: 4px; flex: none; height: 44px; padding: 0 14px 0 12px; border-radius: 22px; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; box-shadow: var(--shadow); }
.send svg { width: 20px; height: 20px; }
.send:disabled { background: var(--track); color: var(--muted); cursor: default; box-shadow: none; }
.send.stop { background: var(--bad-soft); color: var(--bad); }
.cin .send { height: 40px; }

/* ---------- 下のタブ ---------- */
.tabbar { display: flex; justify-content: space-between; background: var(--surface); border-top: 1px solid var(--line); padding-block: 8px max(8px, env(safe-area-inset-bottom, 0px)); position: relative; z-index: 30; }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); padding: 2px 0; position: relative; }
.tabbar button svg { width: 25px; height: 25px; }
.tabbar button span { font-size: 10px; line-height: 1.2; }
.tabbar button[aria-selected="true"] { color: var(--accent); }
.tabbar button[aria-selected="true"]::after { content: ''; position: absolute; bottom: -6px; width: 22px; height: 3px; border-radius: 2px; background: var(--accent); }
.tabbar .dot { position: absolute; top: 0; right: calc(50% - 16px); width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }

/* ---------- 下から出るパネル ---------- */
.scrim { position: absolute; inset: 0; background: rgba(243, 244, 248, 0.55); backdrop-filter: blur(1px); z-index: 20; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .scrim { background: rgba(18, 19, 26, 0.6); } }
:root[data-theme="dark"] .scrim { background: rgba(18, 19, 26, 0.6); }
.sheet { position: absolute; left: 0; right: 0; bottom: var(--tabh, 64px); height: 72%; background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: 0 -6px 30px rgba(29, 32, 48, 0.15); z-index: 25; display: flex; flex-direction: column; animation: up 0.22s ease-out; overflow: hidden; }
.sheet.full { height: calc(100% - var(--tabh, 64px) - 8px); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
.sheet .sh { display: flex; align-items: center; gap: 8px; padding: 6px 16px 10px; font-weight: 900; font-size: 17px; border-bottom: 1px solid var(--line); }
.sheet .sh .ttl { flex: 1; display: flex; align-items: center; gap: 8px; }
.sheet .sh button { color: var(--muted); padding: 4px; display: inline-flex; }
.sheet .body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; display: grid; gap: 12px; align-content: start; }
.sheet[data-k="time"] .sh { background: var(--t-time); color: var(--t-time-fg); }
.sheet[data-k="stat"] .sh { background: var(--t-stat); color: var(--t-stat-fg); }
.sheet[data-k="people"] .sh { background: var(--t-people); color: var(--t-people-fg); }
.sheet[data-k="chat"] .sh { background: var(--t-chat); color: var(--t-chat-fg); }
.sheet[data-k="wallet"] .sh { background: var(--t-wallet); color: var(--t-wallet-fg); }
.sheet[data-k="items"] .sh { background: var(--t-items); color: var(--t-items-fg); }
.sheet[data-k="quest"] .sh { background: var(--t-quest); color: var(--t-quest-fg); }
.sheet[data-k="log"] .sh, .sheet[data-k="settings"] .sh { background: var(--t-log); color: var(--t-log-fg); }

.box { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); }
.row { display: flex; align-items: center; gap: 10px; }
.muted { color: var(--muted); font-size: 13px; }
.big-date { display: flex; align-items: center; gap: 14px; }
.big-date .circ { width: 54px; height: 54px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.big-date b { font-size: 22px; font-weight: 900; display: block; line-height: 1.3; }
.act-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); }
.act-btn:hover { border-color: var(--accent); }
.act-btn .ico { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.act-btn b { display: block; font-size: 16px; }
.act-btn small { color: var(--muted); font-size: 13px; }
.act-btn .chev { margin-left: auto; color: var(--muted); }
.pill-btn { display: inline-flex; align-items: center; gap: 6px; justify-content: center; width: 100%; padding: 10px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); font-weight: 700; border: 1px solid var(--accent-2); }
.field-in { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; padding: 6px 6px 6px 14px; }
.field-in input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 6px 0; outline: none; }
.field-in button { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--muted); }
.selrow { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.selrow b { flex: 1; }
.selrow select { border: 0; background: transparent; color: var(--muted); text-align: right; }

/* ステータス */
.sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
.sitem { display: grid; gap: 4px; padding: 6px 0; min-width: 0; }
.sitem .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; }
.sitem .top b { font-variant-numeric: tabular-nums; color: var(--accent); }
.sitem .top b.low { color: var(--bad); }
.sitem .top .txt { font-weight: 700; color: var(--fg); text-align: right; overflow-wrap: anywhere; }
.sitem .top span:first-child { color: var(--muted); white-space: nowrap; }
.bar { height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width 0.5s ease; }
.bar.red i { background: var(--bad); } .bar.amber i { background: var(--warn); } .bar.green i { background: var(--good); }
.sitem .desc { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.sec { font-size: 13px; font-weight: 900; color: var(--muted); letter-spacing: 0.06em; margin: 4px 0 -4px; }

/* 人物 */
.avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 19px; flex: none; box-shadow: inset 0 -6px 12px rgba(0, 0, 0, 0.18); }
.avatar.sq { border-radius: 14px; }
.avatar.sm { width: 40px; height: 40px; font-size: 16px; }
.pcard { display: grid; gap: 10px; }
.pcard .nm { font-size: 18px; font-weight: 900; }
.pcard .kind { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-left: 6px; font-weight: 500; }
.kv { display: grid; gap: 4px; }
.kv .top { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-weight: 700; }
.kv .top b { color: var(--fg); font-variant-numeric: tabular-nums; }
.kv .top b.pos { color: var(--good); } .kv .top b.neg { color: var(--bad); }
.cbar { position: relative; height: 7px; border-radius: 4px; background: var(--track); }
.cbar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.cbar::after { content: ''; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--line); }
.tline { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.tline span { color: var(--muted); font-weight: 700; white-space: nowrap; }
.tline b { text-align: right; }
.talk { justify-self: start; display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 700; font-size: 14px; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); }
.talk svg { width: 18px; height: 18px; }

/* チャット */
.clist { display: grid; }

  // 名前から決まる色のアバター
  function avatar(name, kind, cls = '') {
    let h = 0;
    for (const ch of str(name)) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    const hue = h % 360;

  }

    const n = Math.round(num(v, 0));
    const s = Math.abs(n).toLocaleString('ja-JP');

  function migratedIds() { try { return JSON.parse(localStorage.getItem(SAVE_KEY + '.moved') || '[]'); } catch { return []; } }

      const g = clone(doc.data());
      const [logs, chats] = await Promise.all([withTimeout(ref.collection('log').get(), 10000), withTimeout(ref.collection('chats').get(), 10000)]);
      g.log = logs.docs.flatMap((d) => arr(d.data().items)).slice(0, num(g.logLen, 0));
      g.chats = {};
      chats.docs.forEach((d) => { g.chats[d.id] = arr(d.data().list); });
      delete g.kind; delete g.logLen;
      this.saved[id] = { logLen: g.log.length, chats: {} };
      return upgrade(g);
    },
    // 変わった所だけを書く。書き込みは 1 つずつ順番に。
    save(g, { chat } = {}) {
      g.updated = Date.now();
      trimMemory(g);
      if (!this.cloud) {
        const ok = writeSaves([g, ...loadSaves().filter((x) => x.id !== g.id)].slice(0, 8));
        this.setState(ok ? 'local' : 'error');
        return;
      }
      const snap = clone(g);
      this.setState('saving');
      this.queue = this.queue.then(async () => {
        const ref = this.ref(snap.id);
        const { log, chats, ...rest } = snap;
        const prev = this.saved[snap.id] || { logLen: 0 };
        await ref.set({ ...rest, kind: 'world', logLen: log.length });
        const from = Math.floor(Math.min(prev.logLen, log.length) / CHUNK);
        const to = Math.floor(Math.max(0, log.length - 1) / CHUNK);
        for (let c = from; c <= to; c++) await ref.collection('log').doc('c' + String(c).padStart(4, '0')).set({ items: log.slice(c * CHUNK, (c + 1) * CHUNK) });
        if (chat && chats[chat]) await ref.collection('chats').doc(chat).set({ list: chats[chat] });
        this.saved[snap.id] = { logLen: log.length };
        this.setState('saved');
      }).catch((e) => { this.setState(e && e.code === 'quota_exceeded' ? 'full' : 'error'); });
      return this.queue;
    },
    async remove(id) {
      await this.ready;
      if (!this.cloud) { writeSaves(loadSaves().filter((x) => x.id !== id)); return; }
      const ref = this.ref(id);
      await this.queue;
      for (const sub of ['log', 'chats']) { const snap = await ref.collection(sub).get(); for (const d of snap.docs) await ref.collection(sub).doc(d.id).delete(); }
      await ref.delete();
      delete this.saved[id];
    },
    // 端末内に残っていた記録を、保存場所へ移す（1 回だけ）
    async migrate() {
      await this.ready;
      if (!this.cloud) return 0;
      const moved = migratedIds();
      const olds = [...loadSaves(), ...(() => { try { return JSON.parse(localStorage.getItem('banshoroku.saves.v1') || '[]'); } catch { return []; } })()].filter((g) => g && g.id && !moved.includes(g.id));
      for (const g of olds) {
        const u = upgrade(clone(g));
        this.saved[u.id] = { logLen: 0 };
        await this.save(u);
        for (const eid of Object.keys(u.chats || {})) await this.save(u, { chat: eid });
        if (this.state !== 'error' && this.state !== 'full') markMigrated(g.id);
      }
      return olds.length;
    },
    setState(st) {
      this.state = st;
      const el = document.getElementById('savestate');
      if (el) el.outerHTML = saveBadge();
    },
  };

  function fitToScreen() {
    try {
      const sw = Math.min(screen.width, screen.height);
      const sh = Math.max(screen.width, screen.height);
      const landscape = matchMedia('(orientation: landscape)').matches;
      const real = landscape ? sh : sw;
      const coarse = matchMedia('(pointer: coarse)').matches;
      if (coarse && real > 200 && innerWidth > real + 2) { document.documentElement.style.setProperty('--appw', real + 'px'); document.documentElement.style.setProperty('--appml', '0px'); }
      else { document.documentElement.style.removeProperty('--appw'); document.documentElement.style.removeProperty('--appml'); }
    } catch { /* 何もしない */ }
  }

    box.innerHTML = list.length || note ? `<p class="lbl">続きから</p>${note ? `<p class="muted">${esc(note)}</p>` : ''}<div class="saves">${list.map((s) => `<div class="save">${avatar(s.title, '国')}<div class="mid"><b>${esc(s.title)}</b><small>${esc(s.date)}・${s.turn}手目${s.status === 'ended' ? '・終幕' : ''}</small></div>
        <button class="btn primary" data-load="${esc(s.id)}">開く</button><button class="btn danger" data-del="${esc(s.id)}">消す</button></div>`).join('')}</div>` : '';
    box.querySelectorAll('[data-load]').forEach((b) => b.onclick = async () => {
      b.disabled = true; b.textContent = '読み込み中…';
      try {
        const g = await Store.load(b.dataset.load);
        if (g) { S.G = g; S.variants = null; S.feedLimit = 60; renderGame(); return; }
        b.textContent = '見つかりません';
      } catch { b.textContent = '読み込めません'; b.disabled = false; }
    });
    box.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => {
      if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = '本当に消す'; return; }
      b.disabled = true; b.textContent = '消しています…';
      try { await Store.remove(b.dataset.del); } catch { /* 次の一覧で分かる */ }

  }

  // ================= 世界づくり =================
  function renderSetup(mode) {
    const work = mode === 'work';
    app.innerHTML = `<div class="scroll"><div class="setup pad">
      <button class="btn" id="back" style="justify-self:start">← 戻る</button>

      ${work ? `<div class="fld"><label for="f-work">作品名</label><input id="f-work" maxlength="80" placeholder="例: 好きな漫画やアニメ、小説のタイトル"></div>
        <div class="fld"><label for="f-char">あなたの登場人物</label><textarea id="f-char" maxlength="600" placeholder="名前・立場・能力・性格など"></textarea></div>
        <div class="fld"><label for="f-scene">始めたい時期・場面（任意）</label><input id="f-scene" maxlength="200" placeholder="例: 物語の序盤、主人公たちと出会う前"><small>空欄なら AI が決めます。</small></div>`
        : `<div class="fld"><label for="f-premise">世界の設定</label><textarea id="f-premise" maxlength="1200" placeholder="例: 魔法が電気の代わりになった1920年代の東京。財閥と魔導師ギルドが対立している。"></textarea></div>
        <div class="fld"><label for="f-char">あなたの立場</label><textarea id="f-char" maxlength="600" placeholder="例: 没落した魔導師の家を継いだ若い当主"></textarea></div>`}
      <div class="row" style="flex-wrap:wrap"><button class="btn primary" id="go">世界を作る</button><button class="btn" id="stop" hidden>やめる</button><span class="status" id="st"></span></div>
    </div></div>`;
    const $ = (id) => document.getElementById(id);
    $('back').onclick = () => { S.ctl && S.ctl.abort(); renderTitle(); };

      const st = $('st');
      if ((work && !inp.work) || (!work && !inp.premise) || !char) { st.className = 'status err'; st.textContent = work ? '作品名と登場人物を書いてください。' : '設定と立場を書いてください。'; return; }
      $('go').disabled = true; st.className = 'status'; st.textContent = 'AI を準備しています…';
      if (!(await getSample())) { st.className = 'status err'; st.textContent = NO_AI; $('go').disabled = false; return; }
      $('stop').hidden = false; st.textContent = '世界を組み立てています…（30秒〜1分ほど）';
      S.ctl = new AbortController();
      try {
        const w = await S.sample.json(genPrompt(work ? 'work' : 'custom', inp), { signal: S.ctl.signal });
        S.G = upgrade(normalizeWorld(w, work ? 'work' : 'custom', inp));
        S.feedLimit = 60;
        try {
          await buildDeep(S.G, (i) => { st.textContent = `${work ? '原作' : '世界の設定'}を詳しく調べています（${i + 1}/4）: ${DEEP_STEPS[i]}…　数分かかります`; });
        } catch { /* あとで「詳しく調べる」からやり直せる */ }
        S.G.log.push({ t: 'intro', text: S.G.intro, date: S.G.date });

  function genPrompt(mode, inp) {
    const head = mode === 'work'
      ? `あなたは対話型シミュレーションゲームのゲームマスター。プレイヤーは既存の作品「${inp.work}」の世界に、原作にいない新しい登場人物として入る。
作品の設定・人物の性格・世界のルールは、あなたの知る原作に忠実に。原作の台詞や文章を長く引き写さず、自分の言葉で書く。よく知らない作品なら、知っている範囲で無理なく組み立てる。
プレイヤーの人物: ${inp.char}
始める時期・場面: ${inp.scene || 'あなたが選ぶ（物語が動き出す印象的な場面）'}`
      : `あなたは対話型シミュレーションゲームのゲームマスター。プレイヤーの書いた設定から、遊べる世界を組み立てる。
世界の設定: ${inp.premise}
プレイヤーの立場: ${inp.char}`;
    return `${head}

この世界の「最初の状態」を日本語で作り、次の形の JSON だけを返す。
{
  "title": "世界の題（15字以内）",
  "premise": "世界の要約（120字以内）",
  "role": "プレイヤーの立場（80字以内）",

  "location": "プレイヤーが今いる場所（20字以内。${mode === 'work' ? '原作に出てくる場所から選ぶ' : '具体的に'}）",
  "intro": "冒頭の場面。情景と人物の気配が伝わるように二人称で（250〜400字）",
  "stats": [{"key": "英小文字の識別子", "name": "数値の名前", "value": 50, "min": 0, "max": 100, "desc": "何を表すか（30字以内）", "fatal": false}],
  "profile": [{"label": "項目（等級・出自・才能・所属・関係など）", "value": "短い言葉（12字以内）"}],
  "wallet": {"unit": "通貨の名前（円・金貨など）", "symbol": "記号（¥ など。無ければ空文字）", "balance": 整数},
  "items": [{"name": "持ち物", "icon": "絵文字1つ", "desc": "説明（40字以内）"}],
  "quests": [{"title": "依頼・仕事の名前", "desc": "内容（50字以内）", "client": "依頼主", "reward": "報酬（金額か言葉）"}],
  "entities": [{"name": "人物や勢力", "kind": "人物 / 組織 / 国 など", "relation": -100〜100（プレイヤーへの好感）, "power": 0〜100（影響力）, "attitude": "態度（6字以内）", "bond": "プレイヤーとの関係（8字以内）", "mood": "今の気分（8字以内）", "desc": "どんな存在か（60字以内）", ${PERSONA_SCHEMA}}],
  "suggestions": ["最初の行動の例", "…", "…"],
  ${PLAYER_SCHEMA}${mode === 'work' ? ',\n  "canon": "原作でのこの時期の状況・人物たちの立場・この後に原作で起きる大きな出来事の流れ（250字以内）"' : ''}
}
決まり:
- stats は 4〜6 個（体力・気力・名声・人脈・戦闘力など、この世界での生き残りと成功に関わる数値）。0 で物語が終わるもの（体力など）は fatal を true。お金は stats ではなく wallet に入れる。
- profile は 4〜8 個。items は 1〜3 個。quests は 2〜3 個。
- player はプレイヤーの人物の設定を、書かれた内容に忠実にまとめる（書かれた強さ・能力を弱めない）。
- persona はそれぞれの人物らしさの核。${mode === 'work' ? '原作の人物は、原作での性格・一人称・口調・価値観をできるだけ正確に。' : ''}国や組織なら、その代表者・使者の口調で書く。
- entities は 5〜8 個。${mode === 'work' ? '原作の主要人物や組織を中心に。まだ知り合いでない人物は relation を 0 付近に。' : '味方・ライバル・敵・中立をまぜる。'}
- suggestions はちょうど 3 つ。具体的で、性格の違う行動に。`;
  }

  function normQuest(q, i) {
    return { id: str(q.id) || 'q' + uid() + i, title: str(q.title, '依頼').slice(0, 40), desc: str(q.desc).slice(0, 100), client: str(q.client, '不明').slice(0, 24), reward: str(q.reward).slice(0, 24), status: ['open', 'taken', 'done', 'failed'].includes(q.status) ? q.status : 'open' };
  }
  function normItem(it) { return { name: str(it.name, '何か').slice(0, 20), icon: [...str(it.icon, '📦')].slice(0, 2).join('') || '📦', desc: str(it.desc).slice(0, 80) }; }

  function normalizeWorld(w, mode, inp) {
    if (!w || typeof w !== 'object') throw { code: 'invalid_json' };
    const used = new Set();
    let stats = arr(w.stats).slice(0, 6).map((s, i) => {
      let key = str(s.key).toLowerCase().replace(/[^a-z0-9_]/g, '') || 's' + i;
      while (used.has(key)) key += '_';
      used.add(key);
      const min = num(s.min, 0); const max = Math.max(min + 1, num(s.max, 100));
      return { key, name: str(s.name, key).slice(0, 10), value: clamp(num(s.value, 50), min, max), min, max, desc: str(s.desc).slice(0, 60), fatal: !!s.fatal };
    });
    if (stats.length < 2) stats = [{ key: 'health', name: '体力', value: 80, min: 0, max: 100, desc: '0 になると倒れる。', fatal: true }, { key: 'fame', name: '名声', value: 20, min: 0, max: 100, desc: '世の中での知られ方。' }];
    const wl = w.wallet && typeof w.wallet === 'object' ? w.wallet : {};
    const date = str(w.date, 'はじまり').slice(0, 30);
    const bal = Math.round(num(wl.balance, 0));
    return {
      id: uid(), v: 2, mode, created: Date.now(), updated: Date.now(), source: inp,
      title: str(w.title, inp.work || '新しい世界').slice(0, 30), premise: str(w.premise).slice(0, 300), role: str(w.role, inp.char).slice(0, 200),
      goal: str(w.goal).slice(0, 120), date, turn: 0, stats, location: str(w.location).slice(0, 30),
      profile: arr(w.profile).slice(0, 8).map((p) => ({ label: str(p.label).slice(0, 8), value: str(p.value).slice(0, 24) })).filter((p) => p.label),
      wallet: { unit: str(wl.unit, '円').slice(0, 6), symbol: str(wl.symbol).slice(0, 2), balance: bal, history: bal ? [{ label: 'はじめの持ち金', amount: bal, date }] : [] },
      items: arr(w.items).slice(0, 3).map(normItem),
      quests: arr(w.quests).slice(0, 3).map(normQuest),
      entities: arr(w.entities).slice(0, 8).map((e, i) => ({
        id: 'e' + (i + 1), name: str(e.name, '名もなき者').slice(0, 20), kind: str(e.kind, '人物').slice(0, 8),
        relation: clamp(Math.round(num(e.relation, 0)), -100, 100), power: clamp(Math.round(num(e.power, 50)), 0, 100),
        attitude: str(e.attitude).slice(0, 10), bond: str(e.bond).slice(0, 12), mood: str(e.mood).slice(0, 12), desc: str(e.desc).slice(0, 100),
        persona: normPersona(e.persona), memory: [],
      })),
      traits: blankTraits(), perception: 'あなたがどんな人物か、まだ誰も知らない。',
      chronicle: [], news: [], log: [], chats: {}, settings: { tier: 'default', tempo: 'normal' },
      suggestions: arr(w.suggestions).slice(0, 3).map((s) => str(s).slice(0, 80)),
      status: 'playing', intro: str(w.intro, 'あなたの物語が始まる。'), canon: str(w.canon).slice(0, 500), glossary: [], player: w.player ? normPlayer(w.player) : null, lore: '',
    };
  }

  // ================= 世界の状態を文章に =================
  function worldText(g, { short = false } = {}) {
    const stats = g.stats.map((s) => `- ${s.name}（key:${s.key}）${s.value}（${s.min}〜${s.max}）${s.fatal ? '［0で終幕］' : ''}${short ? '' : ' … ' + s.desc}`).join('\n');
    const prof = g.profile.map((p) => `${p.label}: ${p.value}`).join('／');
    const ents = g.entities.map((e) => `- id:${e.id}｜${e.name}（${e.kind}）｜状態「${e.status || '生存'}」｜好感 ${e.relation}｜力 ${e.power}｜関係「${e.bond || '-'}」｜態度「${e.attitude || '-'}」｜気分「${e.mood || '-'}」｜${e.desc}${hasPersona(e) ? '\n    人物設定: ' + personaLine(e) : ''}${e.note ? '｜最近: ' + e.note : ''}${arr(e.memory).length ? '｜覚えていること: ' + arr(e.memory).slice(-5).join('／') : ''}`).join('\n');
    const traits = TRAITS.map(([k, n]) => `${n} ${g.traits[k]}`).join('、');
    const items = g.items.map((i) => i.name).join('、') || 'なし';
    const quests = g.quests.filter((q) => q.status === 'open' || q.status === 'taken').map((q) => `- id:${q.id}｜${q.title}（${q.status === 'taken' ? '引き受け中' : '募集中'}）依頼主 ${q.client}・報酬 ${q.reward}`).join('\n') || 'なし';
    return `【世界】${g.title}
${g.premise}
【プレイヤー】${g.role}${hasPlayer(g) ? `
【プレイヤーの人物】（強さ・能力の判定はこれに従う）
${PLAYER_KEYS.map(([k, n]) => `- ${n}: ${g.player[k] || '—'}`).join('\n')}` : ''}${g.deep ? `
【世界のルール（詳しい資料）】（必ず従う）
${g.deep.rules}
【プレイヤーの人物の資料】（必ず従う）
${g.deep.player}
【登場人物の資料】
${g.entities.filter((e) => g.deep.dossiers[e.id]).map((e) => `- ${e.name}: ${g.deep.dossiers[e.id]}`).join('\n') || 'なし'}
【相性分析】（勝ち負けの判定はこれに基づく）
${g.deep.matchups}` : g.lore ? `
【原作資料】（世界のルール・強さの基準・人物の能力。必ず従う）
${g.lore}` : ''}${g.trackers.length ? `
【状態の記録】（プレイヤーの人物の能力の状態。毎手かならず反映し、変わったら tracker_changes で更新する）
${g.trackers.map((t) => `- ${t.name}: ${t.state}`).join('\n')}` : ''}
【目指すもの】${g.goal || '自由'}
【現在】${g.date}（${g.turn + 1}手目）
【いる場所】${g.location || '（未設定。今回の本文から決めて location に書く）'}
【プロフィール】${prof || 'なし'}
【所持金】${money(g.wallet.balance, g.wallet)}
【持ち物】${items}
【依頼】
${quests}
【数値】（ゲーム側が管理。あなたは増減だけ決める）
${stats}
【人物・勢力】
${ents}
【世界から見たプレイヤー】（0〜100、50が普通）${traits}／評判: ${g.perception}
【これまでのあらすじ】
${g.synopsis || '（まだ始まったばかり）'}
【決定的な出来事】
${g.milestones.length ? g.milestones.map((m) => '- ' + m).join('\n') : 'まだない'}${g.canon ? '\n【原作でのこの時期の状況（展開の土台）】\n' + g.canon : ''}
【用語と手がかり】（すでに出た言葉。意味を変えない）
${g.glossary.length ? g.glossary.slice(-30).map((t) => `- ${t.term}: ${t.meaning}`).join('\n') : 'まだない'}`;
  }

  // ================= 1 手 =================
  const ITEM_MAX = 8;
  // 最近使った出来事・言い回し（繰り返し防止のため AI に見せる）
  function recentBeats(g) {
    const res = g.log.filter((l) => l.t === 'res').slice(-8);
    const events = res.flatMap((l) => arr(l.events).map((e) => `${e.actor}: ${e.text}`)).slice(-10);
    const openings = res.slice(-5).map((l) => str(l.narrative).replace(/\s+/g, '').slice(0, 30));
    return { events, openings };
  }
  function threadsText(g) {
    const open = g.threads.filter((t) => t.status !== 'resolved');
    return open.length ? open.map((t) => `- ${t.title}｜今の段階: ${t.stage}${t.stuck ? `（${t.stuck}手のあいだ進んでいない。今回かならず進めるか決着させる）` : ''}`).join('\n') : '（まだない。今回の展開から 1〜3 本立てる）';
  }

  function turnPrompt(g, action) {
    const chron = g.chronicle.slice(g.synopsisUpTo).slice(-16).join('\n') || '（まだない）';
    const recent = g.log.filter((l) => l.t === 'res').slice(-2).map((l) => `［${l.turn}手目］${l.action}\n→ ${str(l.narrative).slice(0, 500)}`).join('\n\n') || str(g.intro).slice(0, 500);
    const beats = recentBeats(g);
    const chats = Object.entries(g.chats || {}).map(([id, list]) => {
      const e = g.entities.find((x) => x.id === id);
      const last = arr(list).slice(-4).map((m) => `${m.role === 'me' ? 'プレイヤー' : e ? e.name : '相手'}「${str(m.text).slice(0, 60)}」`).join(' ');
      return e && last ? `- ${e.name}との会話: ${last}` : '';
    }).filter(Boolean).slice(-4).join('\n');
    const pace = TEMPO_RULE[tempoOf(g)];
    const workRule = g.mode === 'work' ? `\n- この世界は既存の作品「${str(g.source && g.source.work)}」が元。原作の世界観・組織・役職・制度・能力の仕組みの枠を守る。原作に存在しない組織・役職・制度・派閥・術の体系を作らない（例: 原作にない「副長」「書役」などを出さない）。展開は【原作でのこの時期の状況】と原作の人物・場所・出来事を土台にし、プレイヤーが加わったことで少しずつ分かれていく形にする。原作の台詞や文章を長く引き写さない。` : '';
    return `あなたは対話型シミュレーションゲーム「万象録」のゲームマスター。プレイヤーの行動の結果と、世界の反応を決める。

${worldText(g)}

【あらすじ以降の年代記】
${chron}
【直前の展開】
${recent}
【進行中の筋】（未解決の話の流れ。毎手どれかを一段進めるか決着させる）
${threadsText(g)}
【最近すでに使った出来事・書き出し】（これと同じ種類の出来事・同じ言い回しは使わない）
${beats.events.length ? beats.events.map((x) => '- ' + x).join('\n') : '（まだない）'}
${beats.openings.length ? '書き出し: ' + beats.openings.map((x) => '「' + x + '…」').join(' ') : ''}
${chats ? '【最近の個別の会話】（ここで決まったこと・知ったことは、今回の展開に反映する）\n' + chats + '\n' : ''}【展開の速さ】${pace}

【プレイヤーの今回の行動】
${action}

決まり:
- 結果は今の数値・所持金・持ち物・関係・力に基づいて公平に判定する。足りないもの（お金・力・時間・情報）がある行動は「失敗」か「一部成功」。何でも成功させない。良い策でも代償を伴うことが多い。
- 【最優先・プレイヤーの意図】プレイヤーの行動文に書かれた意図（倒す・殺す・奪う・裏切る・脅す など）は、そのまま意図として扱う。弱めない・言い換えない・別の目的にすり替えない。プレイヤーの人物の内心・動機・目的を、あなたが決めたり書き換えたりしない（「本当は倒す気はなかった」「別の目的があった」と地の文や世界の事実にしない）。周りの人物が疑ったり誤解したりすることはあってよいが、それはその人物の思い込みとして書く。結果（成功・失敗）は判定で決めるが、失敗しても「意図がなかった」ことにはしない。
- これはフィクションのゲーム。登場人物を倒す・殺す・重傷を負わせる展開も、判定に従ってそのまま描いてよい（描写は簡潔に、過度に残酷にしない）。原作の主要人物でも、判定の結果が死なら死ぬ。死亡・戦闘不能になった人物は entity_changes の status で記録し、死亡した人物は以後、生きて登場させない。
- 【最重要0・わかりやすさ】プレイヤーが本文だけ読んで筋を追えるように書く。
  ・1手で新しく出す名前・用語（人物・組織・物・術・手がかり）は多くて2つ。出すときは、それが何かを本文の中で一言で説明する。
  ・前に出た人物・物・手がかりに触れるときは、何だったかを短く思い出させる（例:「昨日拾った、朱で書かれた札」）。
  ・謎や陰謀は、プレイヤーがすでに知っている情報だけで筋が追えるように。手がかりは1手に1つずつ明かす。AI だけが知る前提で話を進めない。
  ・誰が話しているかが分かるように、台詞の前後に話し手を書く。長い説明台詞を続けない。
  ・場面の場所は【いる場所】から始める。場所を変えるときは、本文の中で移動を書く（どこからどこへ、なぜ・どうやって行くか）。説明なしに場面を別の場所へ飛ばさない。新しい場所を出すときは、それが何の場所かを一言で書く。${g.mode === 'work' ? '原作に出てこない場所・建物を作らない。' : ''}
- 【最重要1・人物の一貫性】登場人物は、それぞれの「人物設定」（性格・口調・価値観・絶対にしないこと）と好感度に必ず従う。口調（一人称・語尾）を変えない。好感が低い人物や敵対する人物を、急に協力的・親切・素直にしない。話を進めるためでも、人物に「その人らしくない」言動をさせない。${g.mode === 'work' ? '原作の人物は原作での性格・口調・力関係を守る（原作の台詞の引き写しはしない）。' : ''}
- 【最重要3・繰り返さない】直前までの展開・各地の動き・書き出しと同じことを繰り返さない（同じ人物が同じ行動をする、同じ脅し・同じ報告・同じ情景描写、似た文の書き出しは禁止）。進行中の筋は「前と同じ段階」に留めず、一段進めるか決着させる。新しさは、すでに登場している人物・場所・物の新しい組み合わせや、隠れていた一面で出す（新しい要素を増やして変化を出さない）。
- 【最重要2・展開】毎手かならず物語を前に進める。ただし進め方は、人物がその人らしく振る舞った結果として（協力しない人物なら、断る・対立する・裏で動く、という形で話が動く）。行動の結果を最後まで描き切り（相手の返事や反応だけで止めない）、その結果として新しい出来事・情報・状況の変化を最低1つ起こし、次の場面の入り口（引き）で終える。「〜はあなたの答えを待っている」「〜はあなたを見つめている」のような足踏みで終えない。
- プレイヤーが台詞だけを書いた場合も、相手の返事 → その帰結 → 次の展開まで進める。プレイヤーが迷っている・様子を見る場合は、世界の側から出来事を起こす（来訪者・知らせ・事件・敵の動きなど）。
- 「流れに任せて進める」行動なら、プレイヤーの人物らしい自然な行動を選んで進め、物語が大きく動く次の出来事まで描く。
- 「時間を進める」行動なら、その間の出来事を要約して語り、日付を大きく進め、各勢力の動きを多めに入れる。
- 【判定の方針】${JUDGE_RULE[judgeOf(g)]}
- 【原作の仕組みで判定する】結果を書く前に、【世界のルール】【人物資料】【相性分析】【状態の記録】を照らし合わせ、能力の仕組みどうしの関係で勝ち負け・成否を決める。物語の都合・人気・「主要人物だから」・「話を盛り上げるため」で仕組みを曲げない（例: 受けるたびに適応する能力なら、同じ技は回を重ねるごとに通じなくなる。傷が自動で治る能力なら、治療を必要としない）。数や場所の不利も、仕組みに照らして本当に効くかで評価する。
- 【強さの優先順位】強さは「【プレイヤーの人物】の記述 ＞ 【原作資料】 ＞ 一般的なイメージ」の順で決める。【プレイヤーの人物】に書かれた強さが原作の強者を上回るなら、その強者にもプレイヤーが勝つ。プレイヤーの人物を設定より弱く扱わない（格下・同格以下の相手に苦戦させない、能力を理由なく不発にしない、援軍や偶然で勝負を流さない）。原作の主要人物でも、強さで負けるなら負ける・倒れる・死ぬ（主要人物だからといって守らない）。
- 【消耗】プレイヤーの消耗は設定上の強さに見合う分だけ。${drainOf(g) === 'none' ? '今の設定では消耗する値（呪力・体力など）は減らさない。' : drainOf(g) === 'light' ? '今の設定では消耗は軽め。' : ''}
- 数値の変化は stat_changes。消耗（体力・呪力・魔力など）は行動の規模と本人の強さに見合う分だけ: 強い人物の小技や威嚇はほぼ減らない（0〜-2）、普通の戦闘で -3〜-6、全力の大技でも -12 まで。休む・時間が経つと回復させる。大事件以外の増減は ±1〜10。お金の出入りは money_changes（今の所持金を超える支払いはできない）。持ち物の増減は item_changes（持ち物は物語の鍵になる大事な物だけ。ありふれた物・消耗品・お金で買える雑貨は持ち物にしない。1手で増やすのは多くて1つ。持ち物は${ITEM_MAX}個まで（今${g.items.length}個）。使い切った・渡した・壊れた物は remove）。依頼の追加・状態の変化は quest_changes（引き受けたら taken、果たしたら done、しくじったら failed。新しい依頼は物語に合うときだけ）。プロフィールの変化は profile_changes。
- 人物・勢力はそれぞれの目的と性格で自分から動く。毎手かならず 1〜3 件、プレイヤー以外の自発的な動きを world_events に。
- 世界はプレイヤーの「傾向」を覚えて対応を変える（好戦的なら他が手を組んで警戒、約束破りなら信用されない、慈悲深ければ慕われる、謀略が多ければ密偵を警戒される）。今回強まった傾向を trait_changes に。
${judgeOf(g) === 'free' ? '- 行動の文章に結果まで書かれていれば（例:「敵を倒した」）、世界のルール上ありえる限りそのまま採用する。' : '- 行動の文章が結果まで決めつけていても（例:「敵を倒した」）、それは試みとして扱い、結果は判定の方針に従ってあなたが判定する。'}${workRule}
- 【これまでのあらすじ】【決定的な出来事】と各人物の「覚えていること」は、過去の事実。矛盾させない。昔の約束・恩・恨みは、ふさわしい場面で人物の行動に反映させる。
- 物語が決定的に終わったとき（目的を果たした、致命的な敗北、0で終幕の数値が0）だけ ending を入れる。

次の形の JSON だけを返す（narrative を最初に）:

threads は今回の後の「進行中の筋」全体（未解決は最大5本。決着したものは resolved で一度だけ返す）。使わない欄は空の配列。trait_changes は各 -10〜10。`;
  }

  function applyResult(g, r, action) {
    const chips = [];
    // 同じ数値への増減は合計してから上限をかける（分けて減らして上限をすり抜けない）
    const sums = new Map();
    arr(r.stat_changes).forEach((c) => {
      const s = g.stats.find((x) => x.key === str(c.key) || x.name === str(c.key));
      if (s) sums.set(s, (sums.get(s) || 0) + num(c.delta, 0));
    });
    const mul = DRAIN_MUL[drainOf(g)];
    sums.forEach((d, s) => {
      if (d < 0 && s.drain) d *= mul;
      d = clamp(Math.round(d), -12, 25);
      const before = s.value;
      s.value = clamp(s.value + d, s.min, s.max);
      if (s.value !== before) chips.push({ label: s.name, delta: s.value - before });
    });
    arr(r.money_changes).slice(0, 4).forEach((m) => {
      let a = Math.round(num(m.amount, 0));
      if (!a) return;
      if (a < 0 && g.wallet.balance + a < 0) a = -g.wallet.balance;
      if (!a) return;
      g.wallet.balance += a;
      g.wallet.history.unshift({ label: str(m.label, a > 0 ? '入金' : '支払い').slice(0, 30), amount: a, date: str(r.new_date, g.date).slice(0, 30) });
      chips.push({ label: str(m.label, '所持金').slice(0, 12), delta: a, money: true });
    });
    g.wallet.history = g.wallet.history.slice(0, 40);
    let added = 0;
    const changes = arr(r.item_changes).slice(0, 4);
    changes.filter((c) => c.op === 'remove').forEach((c) => {
      const i = g.items.findIndex((x) => x.name === str(c.name).slice(0, 20));
      if (i >= 0) { chips.push({ label: '失った: ' + g.items[i].name, delta: -1, text: true }); g.items.splice(i, 1); }
    });
    changes.filter((c) => c.op !== 'remove').forEach((c) => {
      const name = str(c.name).slice(0, 20);
      if (!name || added >= 1 || g.items.some((x) => x.name === name)) return;
      if (g.items.length >= ITEM_MAX) { chips.push({ label: `持ち物がいっぱいで「${name}」を持てなかった`, delta: -1, text: true }); return; }
      g.items.push(normItem(c)); added++;
      chips.push({ label: '手に入れた: ' + name, delta: 1, text: true });
    });
    arr(r.quest_changes).slice(0, 4).forEach((c, i) => {
      const q = g.quests.find((x) => x.id === str(c.id) || x.title === str(c.title));
      if (q) { if (['open', 'taken', 'done', 'failed'].includes(c.status)) q.status = c.status; if (c.desc) q.desc = str(c.desc).slice(0, 100); }
      else if (c.title) g.quests.unshift(normQuest({ ...c, id: '' }, i));
    });
    g.quests = g.quests.slice(0, 12);
    arr(r.profile_changes).slice(0, 4).forEach((p) => {
      const label = str(p.label).slice(0, 8);
      if (!label) return;
      const ex = g.profile.find((x) => x.label === label);
      if (ex) ex.value = str(p.value).slice(0, 24); else if (g.profile.length < 10) g.profile.push({ label, value: str(p.value).slice(0, 24) });
    });
    arr(r.entity_changes).forEach((c) => {
      const e = g.entities.find((x) => x.id === str(c.id) || x.name === str(c.id) || x.name === str(c.name));
      if (!e) return;
      const rd = clamp(Math.round(num(c.relation_delta, 0)), -30, 30);
      e.relation = clamp(e.relation + rd, -100, 100);
      e.power = clamp(e.power + clamp(Math.round(num(c.power_delta, 0)), -20, 20), 0, 100);
      ['attitude', 'bond', 'mood'].forEach((k) => { if (c[k]) e[k] = str(c[k]).slice(0, 12); });
      if (c.note) e.note = str(c.note).slice(0, 60);
      if (ENT_STATUS.includes(str(c.status)) && c.status !== (e.status || '生存')) { e.status = c.status; chips.push({ label: `${e.name}: ${c.status}`, delta: c.status === '生存' ? 1 : -1, text: true }); }
      if (str(c.memory).trim()) { e.memory = [...arr(e.memory), `${g.turn + 1}手目: ${str(c.memory).trim().slice(0, 40)}`].slice(-8); }
      if (rd) chips.push({ label: e.name + 'の好感', delta: rd });
    });
    arr(r.new_entities).slice(0, 2).forEach((n) => {
      const name = str(n.name).slice(0, 20);
      if (!name || g.entities.some((e) => e.name === name) || g.entities.length >= 16) return;
      g.entities.push({ id: 'n' + uid(), name, kind: str(n.kind, '人物').slice(0, 8), relation: clamp(Math.round(num(n.relation, 0)), -100, 100), power: clamp(Math.round(num(n.power, 40)), 0, 100), attitude: str(n.attitude).slice(0, 10), bond: str(n.bond).slice(0, 12), mood: str(n.mood).slice(0, 12), desc: str(n.desc).slice(0, 100), persona: normPersona(n.persona), memory: [], isNew: g.turn + 1 });
      chips.push({ label: '出会い: ' + name, delta: 1, text: true });
    });
    const tc = r.trait_changes && typeof r.trait_changes === 'object' ? r.trait_changes : {};
    TRAITS.forEach(([k]) => { g.traits[k] = clamp(g.traits[k] + clamp(Math.round(num(tc[k], 0)), -10, 10), 0, 100); });
    if (r.perception) g.perception = str(r.perception).slice(0, 90);
    const news = arr(r.news).slice(0, 3).map((n) => ({ source: str(n.source).slice(0, 20), headline: str(n.headline).slice(0, 80), turn: g.turn + 1 }));
    g.news = [...news, ...g.news].slice(0, 20);
    const events = arr(r.world_events).slice(0, 4).map((e) => ({ actor: str(e.actor).slice(0, 24), text: str(e.text).slice(0, 100) }));
    g.turn += 1;
    if (r.new_date) g.date = str(r.new_date).slice(0, 30);
    const fromLoc = g.location;
    const toLoc = str(r.location).trim().slice(0, 30);
    let moved = null;
    if (toLoc && toLoc !== fromLoc) { if (fromLoc) moved = { from: fromLoc, to: toLoc }; g.location = toLoc; }
    g.chronicle.push(`${g.turn}｜${g.date}｜${str(r.summary, action).slice(0, 60)}`);
    if (str(r.milestone).trim()) g.milestones.push(`${g.turn}手目（${g.date}）: ${str(r.milestone).trim().slice(0, 50)}`);
    const outcome = ['success', 'partial', 'failure'].includes(r.outcome) ? r.outcome : 'partial';
    // 状態の記録
    arr(r.tracker_changes).slice(0, 8).forEach((t) => {
      const name = str(t.name).trim().slice(0, 40);
      const state = str(t.state).trim().slice(0, 120);
      if (!name || !state) return;
      const ex = g.trackers.find((x) => x.name === name);
      if (ex) { if (ex.state !== state) { ex.state = state; chips.push({ label: `${name}: ${state}`, delta: 1, text: true }); } }
      else if (g.trackers.length < 10) { g.trackers.push({ name, state }); chips.push({ label: `${name}: ${state}`, delta: 1, text: true }); }
    });
    const terms = arr(r.terms).slice(0, 3).map((t) => ({ term: str(t.term).trim().slice(0, 20), meaning: str(t.meaning).trim().slice(0, 50), turn: g.turn })).filter((t) => t.term && t.meaning);
    terms.forEach((t) => { const ex = g.glossary.find((x) => x.term === t.term); if (ex) ex.meaning = t.meaning; else g.glossary.push(t); });
    g.glossary = g.glossary.slice(-60);
    g.log.push({ t: 'res', turn: g.turn, date: g.date, action, outcome, reason: str(r.outcome_reason).slice(0, 60), basis: str(r.judge_basis).slice(0, 100), narrative: str(r.narrative), chips, events, situation: str(r.situation).slice(0, 90), terms, location: g.location, moved });
    g.suggestions = arr(r.suggestions).slice(0, 3).map((s) => str(s).slice(0, 80));
    // 進行中の筋: 段階が変わらなければ「進んでいない」を数える
    const incoming = arr(r.threads).map((t) => ({ title: str(t.title).slice(0, 20), stage: str(t.stage).slice(0, 40), status: t.status === 'resolved' ? 'resolved' : 'open' })).filter((t) => t.title);
    if (incoming.length) {
      const next = [];
      incoming.forEach((t) => {
        const old = g.threads.find((x) => x.title === t.title);
        if (t.status === 'resolved') { if (old && old.status !== 'resolved') chips.push({ label: '決着: ' + t.title, delta: 1, text: true }); return; }
        next.push({ ...t, since: old ? old.since : g.turn, stuck: old && old.stage === t.stage ? (old.stuck || 0) + 1 : 0 });
      });
      g.threads = next.slice(0, 5);
    } else {
      g.threads.forEach((t) => (t.stuck = (t.stuck || 0) + 1));
    }
    let ending = r.ending && typeof r.ending === 'object' ? r.ending : null;
    const dead = g.stats.find((s) => s.fatal && s.value <= s.min);
    if (!ending && dead) ending = { type: 'defeat', title: dead.name + 'が尽きた', text: `${dead.name}が尽き、あなたの物語はここで幕を閉じた。` };

  async function sendAction(action, { regen = false } = {}) {
    action = str(action).trim();

    if (S.deepStep != null) { S.toast = '資料を調べ終わるまで、少し待ってください。'; renderGame(); return; }
    const base = regen && S.variants ? S.variants.base : clone(S.G);
    S.busy = true; S.toast = ''; S.sheet = null; S.showSugg = false;
    if (regen) S.G = clone(base);
    S.G.log.push({ t: 'act', turn: S.G.turn + 1, text: action });
    renderGame();
    if (!(await getSample())) {
      S.G = regen && S.variants ? clone(S.variants.list[S.variants.idx]) : base;
      if (!regen) S.draft = action;
      S.toast = NO_AI; S.busy = false; renderGame();
      return;
    }
    try {
      const next = await runTurn(base, action);
      if (!regen || !S.variants) S.variants = { base, action, list: [] };
      S.variants.list.push(next);
      S.variants.idx = S.variants.list.length - 1;
      S.G = clone(next);
      save();

      S.G = S.variants && regen ? clone(S.variants.list[S.variants.idx]) : base;
